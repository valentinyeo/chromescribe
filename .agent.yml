name: chromescribe-monitor
project: chromescribe
description: >-
  YouTube channel monitor: checks subscribed channels for new videos, transcribes via Whisper API, summarizes with pi (MiniMax), classifies topics, uploads to Chromescribe dashboard, notifies via
  Telegram. Runs 4x/day.
tech: cron
llm: pi
provider: minimax
trigger:
  type: cron
  frequency: every-4h
status_check:
  type: log_mtime
  path: /home/valentin/projects/chromescribe/monitor.log
  max_age_minutes: 480
owner: valentin
tags:
  - youtube
  - transcription
  - monitor
