name: chromescribe-monitor
project: chromescribe
description: >-
  YouTube channel monitor: checks subscribed channels for new videos, transcribes with Workers AI Whisper, summarizes and classifies with Workers AI Gemma through AI Gateway, uploads to Chromescribe dashboard, notifies via
  Telegram. Runs 4x/day.
tech: cron
llm: workers-ai
provider: cloudflare
trigger:
  type: cron
  frequency: every-4h
status_check:
  type: log_mtime
  path: monitor.log
  max_age_minutes: 480
owner: valentin
tags:
  - youtube
  - transcription
  - monitor
