<!DOCTYPE html>
<html>
<head>
<style>
  body {
    width: 180px;
    margin: 0;
    padding: 12px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    background: #1a1a2e;
    color: #e0e0e0;
  }
  button {
    display: block;
    width: 100%;
    padding: 10px 14px;
    border: 1px solid #333;
    border-radius: 6px;
    background: #2a2a4a;
    color: #e0e0e0;
    font-size: 13px;
    cursor: pointer;
    text-align: left;
  }
  button:hover {
    background: #3a3a6a;
    border-color: #555;
  }
  .icon {
    margin-right: 8px;
  }
</style>
</head>
<body>
  <button id="btn-pi"><span class="icon">🟠</span>Process with Pi</button>
  <script src="popup.js"></script>
</body>
</html>
