name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Dashboard
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: All checks in parallel
        working-directory: .
        run: bash tools/run-checks.sh

      - name: Cache Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.65.0

      - name: Release proof for changed features
        working-directory: .
        env:
          VIDEO: "1"
        run: |
          npm install -g wrangler@4.82.2 playwright@1.65.0
          npx -y playwright@1.65.0 install --with-deps chromium || npx -y playwright@1.65.0 install chromium
          bash tools/run-journeys.sh "${{ github.event.before }}"

      - name: Upload release proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-proof-${{ github.sha }}
          path: /tmp/cs-verify/proof
          if-no-files-found: ignore
          retention-days: 90

      - name: Cache wrangler
        uses: actions/cache@v4
        with:
          path: ~/.wrangler-cli
          key: ${{ runner.os }}-wrangler-4.82.2

      - name: Install wrangler
        run: |
          if [ ! -x "$HOME/.wrangler-cli/node_modules/.bin/wrangler" ]; then
            npm install --prefix "$HOME/.wrangler-cli" wrangler@4.82.2
          fi
          echo "$HOME/.wrangler-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Deploy dashboard
        run: bash deploy.sh

      - name: Check the live site
        working-directory: .
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: node tools/live-check.mjs https://chromescribe.yeoux.net --version "$GITHUB_SHA" --require-login
