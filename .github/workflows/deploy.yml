name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Upload index.html to R2
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: r2 object put chromescribe-transcripts/index.html --file=./public/index.html --remote
          workingDirectory: dashboard

      - name: Upload transcript.html to R2
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: r2 object put chromescribe-transcripts/transcript.html --file=./public/transcript.html --remote
          workingDirectory: dashboard

      - name: Upload settings.html to R2
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: r2 object put chromescribe-transcripts/settings.html --file=./public/settings.html --remote
          workingDirectory: dashboard

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: dashboard
