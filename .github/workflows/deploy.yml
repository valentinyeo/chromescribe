name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Dashboard
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Worker changes
        id: worker-changes
        working-directory: .
        run: |
          if git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- dashboard/src dashboard/wrangler.toml; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install wrangler
        run: npm install -g wrangler@4.82.2

      - name: Upload static files to R2
        run: |
          wrangler r2 object put chromescribe-transcripts/index.html --file=./public/index.html --remote
          wrangler r2 object put chromescribe-transcripts/transcript.html --file=./public/transcript.html --remote
          wrangler r2 object put chromescribe-transcripts/settings.html --file=./public/settings.html --remote
          wrangler r2 object put chromescribe-transcripts/stats.html --file=./public/stats.html --remote
          wrangler r2 object put chromescribe-transcripts/subscriptions.html --file=./public/subscriptions.html --remote

          wrangler r2 object put chromescribe-transcripts/queue.html --file=./public/queue.html --remote
          wrangler r2 object put chromescribe-transcripts/reports.html --file=./public/reports.html --remote

      - name: Deploy Worker
        if: steps.worker-changes.outputs.deploy == 'true'
        run: wrangler deploy
