name: Weekly secret rescan

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-history:
    name: full-history-secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Fetch every branch
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Drop the pull request refs earlier jobs leave on this runner
        run: git for-each-ref --format='%(refname)' 'refs/remotes/pull' | xargs -r -n1 git update-ref -d
      - name: Run gitleaks on all history
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --no-banner --source . --redact --log-opts="--all"
      - name: Run trufflehog on all history, live keys only
        if: always()
        run: |
          curl -sSfL https://github.com/trufflesecurity/trufflehog/releases/download/v3.97.0/trufflehog_3.97.0_linux_amd64.tar.gz | tar -xz trufflehog
          set +e
          ./trufflehog git "file://$PWD" --results=verified --fail --no-update --json > found.json 2> trufflehog.err
          code=$?
          set -e
          grep -o '"DetectorName":"[^"]*"\|"file":"[^"]*"\|"commit":"[^"]*"' found.json || true
          grep -o '"verified_secrets":[0-9]*\|"unverified_secrets":[0-9]*' trufflehog.err | tr '\n' ' ' || true
          rm -f found.json
          if [ "$code" = 183 ]; then
            echo "::error::A working key is in the git history. Replace it, store the new one in 1Password, and cancel the old one."
            exit 1
          fi
          if [ "$code" != 0 ]; then tail -5 trufflehog.err; exit "$code"; fi
