name: Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - master
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: verify-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  pstack-verifier:
    name: pstack-verifier
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR: ${{ inputs.pr }}
        run: |
          event="$RUNNER_TEMP/event.json"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            cp "$GITHUB_EVENT_PATH" "$event"
          else
            gh api "repos/$GITHUB_REPOSITORY/pulls/$INPUT_PR" | jq '{pull_request: .}' > "$event"
            [ "$(jq -r .pull_request.head.sha "$event")" = "$GITHUB_SHA" ] || { echo "Dispatch on the pull request's head branch"; exit 1; }
          fi
          delim="EOF_$(openssl rand -hex 8)"
          {
            echo "EVENT_FILE=$event"
            echo "PR=$(jq -r .pull_request.number "$event")"
            echo "HEAD=$(jq -r .pull_request.head.sha "$event")"
            echo "BASE=$(jq -r .pull_request.base.sha "$event")"
            echo "TITLE<<$delim"; jq -r .pull_request.title "$event"; echo "$delim"
            echo "BODY<<$delim"; jq -r '.pull_request.body // ""' "$event"; echo "$delim"
          } >> "$GITHUB_ENV"
          echo "head=$(jq -r .pull_request.head.sha "$event")" >> "$GITHUB_OUTPUT"
          echo "base=$(jq -r .pull_request.base.sha "$event")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.base }}
          path: .verify-base
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cursor/plugins
          ref: e58dd043600587dbaf58ba315e7f2b38373eeb43
          path: .verify-pstack
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pick a verifier from another model family
        run: |
          picker=.verify-base/scripts/pick-verifier-model
          [ -f "$picker" ] || picker=scripts/pick-verifier-model
          models=$(python3 -I "$picker" --all --event "$EVENT_FILE" 2>/dev/null) || models=$(python3 -I "$picker" --event "$EVENT_FILE") || exit 1
          models=$(echo $models)
          echo "VERIFIER_MODELS=$models" >> "$GITHUB_ENV"
          echo "VERIFIER_MODEL=${models%% *}" >> "$GITHUB_ENV"
          echo "Verifier models, in order: $models"
      - name: No skip markers in commits or title
        run: |
          if { echo "$TITLE"; git log --format=%B "$BASE..$HEAD"; } | grep -niE '\[(skip ci|ci skip|no ci|skip actions|actions skip)\]'; then
            echo "Remove the skip marker above: a squash merge carries it to master and the deploy never runs."
            exit 1
          fi
      - name: Cheap checks
        run: |
          set +e
          bash tools/run-checks.sh > "$RUNNER_TEMP/checks.log" 2>&1
          echo "CHECKS_EXIT=$?" >> "$GITHUB_ENV"
          tail -40 "$RUNNER_TEMP/checks.log"
      - name: Secret scan on this change
        id: leaks
        timeout-minutes: 1
        run: |
          set +e
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --no-banner --source . --redact --log-opts "$BASE..$HEAD" > "$RUNNER_TEMP/leaks.log" 2>&1
          echo "LEAKS_EXIT=$?" >> "$GITHUB_ENV"
          tail -20 "$RUNNER_TEMP/leaks.log"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.65.0
      - name: Install wrangler, Playwright and pi
        id: install
        timeout-minutes: 3
        run: |
          npm install -g wrangler@4.82.2 playwright@1.65.0 @earendil-works/pi-coding-agent@1.5.0
          npx -y playwright@1.65.0 install --with-deps chromium || npx -y playwright@1.65.0 install chromium
          command -v ffmpeg || { sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; }
      - name: Independent verification
        id: verify
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          test -n "$OPENCODE_API_KEY" || { echo "OPENCODE_API_KEY is missing: fork pull requests cannot run the verifier"; exit 1; }
          meta="$RUNNER_TEMP/pr.md"
          printf '%s\n\n%s\n' "$TITLE" "$BODY" > "$meta"
          sed -e "s|__PSTACK__|$GITHUB_WORKSPACE/.verify-pstack|g" -e "s|__PR__|$PR|g" -e "s|__HEAD__|$HEAD|g" -e "s|__BASE__|$BASE|g" \
            -e "s|__BASEDIR__|$GITHUB_WORKSPACE/.verify-base|g" -e "s|__META__|$meta|g" \
            -e "s|__CHECKS__|$RUNNER_TEMP/checks.log|g" -e "s|__CHECKS_EXIT__|$CHECKS_EXIT|g" \
            -e "s|__LEAKS__|$RUNNER_TEMP/leaks.log|g" -e "s|__LEAKS_EXIT__|$LEAKS_EXIT|g" \
            tools/verifier/brief.md > "$RUNNER_TEMP/brief.md"
          deadline=$(( $(date +%s) + 900 ))
          for model in $VERIFIER_MODELS; do
            left=$(( deadline - $(date +%s) ))
            [ "$left" -gt 90 ] || { echo "VERIFIER_TIMED_OUT=1" >> "$GITHUB_ENV"; break; }
            echo "VERIFIER_MODEL=$model" >> "$GITHUB_ENV"
            code=0
            timeout --kill-after=20 "$left" pi --provider opencode-go --model "$model" --thinking medium \
              --no-extensions --no-mcp --no-skills --no-context-files --no-prompt-templates --no-themes \
              --tools read,bash --no-session --mode json -p "$(cat "$RUNNER_TEMP/brief.md")" > "$RUNNER_TEMP/verifier.jsonl" || code=$?
            [ "$code" -ne 124 ] || { echo "VERIFIER_TIMED_OUT=1" >> "$GITHUB_ENV"; echo "$model ran out of the 15 minute budget"; break; }
            node tools/verifier/verdict.mjs "$RUNNER_TEMP/verifier.jsonl" > /dev/null && break
            tail -n 5 "$RUNNER_TEMP/verifier.jsonl" | grep -q 'rate_limit_error' || break
            echo "$model is rate limited; trying the next verifier family"
          done
      - name: Post the verdict
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LEAKS_OUTCOME: ${{ steps.leaks.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set +e
          touch "$RUNNER_TEMP/verifier.jsonl"
          node tools/verifier/verdict.mjs "$RUNNER_TEMP/verifier.jsonl" > "$RUNNER_TEMP/verdict.json"
          verdict=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).verdict||'')" "$RUNNER_TEMP/verdict.json")
          [ "$CHECKS_EXIT" = 0 ] || verdict=FAIL
          [ "$LEAKS_EXIT" = 0 ] || verdict=FAIL
          node -e "
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
            const v = process.argv[2] || 'FAIL';
            const notes = [];
            if (process.env.CHECKS_EXIT !== '0') notes.push('Cheap checks failed (tools/run-checks.sh exit ' + process.env.CHECKS_EXIT + ').');
            if (process.env.LEAKS_EXIT !== '0') notes.push('Secret scan found a leak in this change.');
            const stuck = [['Secret scan on this change', process.env.LEAKS_OUTCOME], ['Install wrangler, Playwright and pi', process.env.INSTALL_OUTCOME]].find(([, outcome]) => outcome && outcome !== 'success');
            if (!process.argv[2] && stuck) notes.push('Setup step failed or timed out: ' + stuck[0] + '. The verifier never ran, so this PR gets FAIL.');
            else if (!process.argv[2]) notes.push(process.env.VERIFY_OUTCOME === 'success' ? 'The verifier returned no verdict.' : 'The verifier step ended as ' + process.env.VERIFY_OUTCOME + ', so no verdict was produced.');
            if (process.env.VERIFIER_TIMED_OUT === '1') notes.push('The verifier ran out of its 15 minute budget, so a verdict arrives within 20 minutes or fails.');
            const body = [v, '', ...notes, r.text.slice(0, 60000), '', 'Verifier: opencode-go/' + process.env.VERIFIER_MODEL + '. Head ' + process.env.HEAD + '.', 'Trace: ' + process.env.RUN_URL].join('\n');
            fs.writeFileSync(process.argv[3], body);
          " "$RUNNER_TEMP/verdict.json" "$verdict" "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md" || { echo "Could not post the verdict comment; a verdict nobody can read does not count."; exit 1; }
          echo "Verdict: ${verdict:-none}"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            state=failure
            case "$verdict" in PASS|PASS+NOTES) state=success ;; esac
            gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD" -f state="$state" -f context=pstack-verifier -f target_url="$RUN_URL" -f description="${verdict:-FAIL}" > /dev/null || { echo "Could not post the pstack-verifier status"; exit 1; }
          fi
          case "$verdict" in PASS|PASS+NOTES) exit 0 ;; *) exit 1 ;; esac
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: verifier-trace
          path: |
            ${{ runner.temp }}/verifier.jsonl
            ${{ runner.temp }}/checks.log
            ${{ runner.temp }}/comment.md
            /tmp/cs-verify/proof
          retention-days: 14
