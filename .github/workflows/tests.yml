name: Tests

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: CLI tests
        run: node --test cli/test/*.test.mjs
      - name: Dashboard tests
        working-directory: dashboard
        run: node --test test/*.test.mjs
