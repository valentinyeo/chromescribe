name: Feature map upkeep

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: map-maintenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maintain:
    name: Maintain the verify skill
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: cursor/plugins
          ref: e58dd043600587dbaf58ba315e7f2b38373eeb43
          path: .verify-pstack
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.65.0
      - name: Install wrangler, Playwright and pi
        run: |
          npm install -g wrangler@4.82.2 playwright@1.65.0 @earendil-works/pi-coding-agent@1.5.0
          npx -y playwright@1.65.0 install --with-deps chromium || npx -y playwright@1.65.0 install chromium
          command -v ffmpeg || { sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; }
      - name: Run the maintenance pass
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          sed "s#__PSTACK__#$PWD/.verify-pstack/pstack#" tools/maintainer/brief.md > /tmp/maintainer-brief.md
          pi -p --provider opencode-go --model deepseek-v4.1-flash --thinking medium "$(cat /tmp/maintainer-brief.md)" | tee /tmp/maintainer.log
      - name: Open or update one pull request of corrections
        id: pr
        run: |
          rm -rf .verify-pstack
          git add -A .claude/skills/verify-chromescribe
          outside=$(git status --porcelain -- . ':!.claude/skills/verify-chromescribe')
          if [ -n "$outside" ]; then
            echo "$outside"
            echo "::error::The upkeep pass edited files outside the verify skill. pstack maintain-verification-skill allows edits only inside it."
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "clean: no corrections"
            exit 0
          fi
          node --test tools/feature-map.test.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          open=$(gh pr list --state open --base master --json number,headRefName --jq '[.[] | select(.headRefName | startswith("map-upkeep-"))][0] // empty')
          branch=$(printf '%s' "$open" | jq -r '.headRefName // empty')
          if [ -n "$branch" ]; then
            echo "Updating the open map pull request on $branch instead of opening another one"
          else
            branch="map-upkeep-$(date -u +%Y%m%d)"
          fi
          git checkout -b "$branch"
          git commit -m "Feature map upkeep $(date -u +%F)"
          git push -f origin "$branch"
          printf 'Author model: deepseek/deepseek-v4.1-flash\n\nDaily feature map upkeep. Pass log tail:\n\n' > /tmp/body.md
          tail -n 40 /tmp/maintainer.log | sed 's/^/    /' >> /tmp/body.md
          pr=$(printf '%s' "$open" | jq -r '.number // empty')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "Feature map upkeep $(date -u +%F)" --body-file /tmp/body.md
          else
            gh pr create --base master --head "$branch" --title "Feature map upkeep $(date -u +%F)" --body-file /tmp/body.md
            pr=$(gh pr list --head "$branch" --json number --jq '.[0].number')
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          gh workflow run verify.yml --ref "$branch" -f pr="$pr"
      - name: Merge the pull request on a PASS verdict
        if: ${{ steps.pr.outputs.pr != '' }}
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr="${{ steps.pr.outputs.pr }}"
          deadline=$(( $(date +%s) + 25 * 60 ))
          state=""
          while [ "$(date +%s)" -lt "$deadline" ]; do
            head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq .head.sha)
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$head/status" --jq '[.statuses[] | select(.context == "pstack-verifier")] | sort_by(.created_at) | last | .state // ""')
            case "$state" in success|failure|error) break ;; esac
            sleep 20
          done
          if [ "$state" != success ]; then
            echo "::error::No PASS verdict on #$pr within 25 minutes (pstack-verifier is ${state:-missing}), so it stays open for a person."
            exit 1
          fi
          gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$pr/merge" -f merge_method=squash --jq '.merged' | grep -qx true || {
            echo "::error::The verifier passed but #$pr did not merge. Read the merge response above."
            exit 1
          }
          echo "Merged #$pr on the verifier's PASS verdict"
      - name: Upload the pass log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-maintenance-${{ github.run_id }}
          path: |
            /tmp/maintainer.log
            /tmp/cs-verify/proof
          if-no-files-found: ignore
