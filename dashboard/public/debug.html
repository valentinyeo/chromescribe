<!DOCTYPE html>
<html>
<head>
  <title>Debug - API Test</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #fff; }
    .success { color: #0f0; }
    .error { color: #f00; }
    pre { background: #333; padding: 10px; overflow: auto; }
    button { padding: 10px 20px; background: #0057ff; color: #fff; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <h1>API Debug Test</h1>
  <button onclick="testAPI()">Test API</button>
  <div id="result"></div>
  
  <script>
    const API = 'https://chromescribe-dashboard.ancient-glitter-9ac9.workers.dev/api';
    
    async function testAPI() {
      const result = document.getElementById('result');
      result.innerHTML = '<p>Testing...</p>';
      
      try {
        const metaRes = await fetch(`${API}/transcripts/7`);
        const meta = await metaRes.json();
        result.innerHTML += `<p class="${meta.success ? 'success' : 'error'}">Meta API: ${meta.success ? 'OK' : 'FAIL'}</p>`;
        result.innerHTML += `<p>Title: ${meta.data?.title || 'N/A'}</p>`;
        
        const contentRes = await fetch(`${API}/transcript/7/content`);
        const content = await contentRes.text();
        result.innerHTML += `<p class="${content ? 'success' : 'error'}">Content API: ${content ? 'OK (' + content.length + ' chars)' : 'FAIL'}</p>`;
        
        result.innerHTML += `<h3>Content Preview:</h3><pre>${content.substring(0, 500)}</pre>`;
        
      } catch (err) {
        result.innerHTML += `<p class="error">Error: ${err.message}</p>`;
      }
    }
    
    testAPI();
  </script>
</body>
</html>
