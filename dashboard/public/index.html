<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChromeScribe</title>
  <script>
    // Shared theme bootstrap. This block is identical in index.html and
    // transcript.html on purpose - change both or neither. It runs before
    // paint so the page never flashes the wrong theme.
    (function () {
      var KEY = 'cs-theme';
      var ORDER = ['system', 'dark', 'light'];
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      function choice() {
        try {
          var v = localStorage.getItem(KEY);
          return ORDER.indexOf(v) === -1 ? 'system' : v;
        } catch (e) { return 'system'; }
      }
      function paint(c) {
        var root = document.documentElement;
        root.setAttribute('data-theme', c === 'system' ? (mq.matches ? 'dark' : 'light') : c);
        root.setAttribute('data-theme-choice', c);
      }
      window.csTheme = {
        get: choice,
        icon: function () { var c = choice(); return c === 'system' ? '◐' : c === 'dark' ? '☀' : '🌙'; },
        label: function () { return 'Theme: ' + choice(); },
        set: function (c) {
          try { localStorage.setItem(KEY, c); } catch (e) {}
          paint(c);
          if (window.csThemeRender) window.csThemeRender();
        },
        cycle: function () { window.csTheme.set(ORDER[(ORDER.indexOf(choice()) + 1) % ORDER.length]); }
      };
      // Following the device means following it as it changes, not just at load.
      mq.addEventListener('change', function () { if (choice() === 'system') paint('system'); });
      paint(choice());
    })();
  </script>
  <script>
    history.scrollRestoration = 'manual';
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --foreground: #fff;
      --background: #030303;
      --border: #27272a;
      --muted: #71717a;
      --text: #a1a1aa;
      --accent: #0057ff;
      --accent-hover: #0066ff;
      --error: #ef4444;
      --success: #22c55e;
      --card: #090909;
      --card-hover: #111111;
      --surface: #1a1a1a;
      --chip-bg: rgba(255, 255, 255, 0.05);
      --chip-on-accent-bg: rgba(255, 255, 255, 0.18);
      --chip-on-accent-fg: rgba(255, 255, 255, 0.8);
      --accent-soft-bg: rgba(0, 87, 255, 0.12);
      --accent-soft-border: rgba(0, 87, 255, 0.4);
      --accent-soft-fg: #6ea8ff;
    }

    :root[data-theme="light"] {
      --foreground: #111113;
      --background: #f7f7f9;
      --border: #e1e1e7;
      --muted: #6b6b76;
      --text: #3f3f4a;
      --accent: #0057ff;
      --accent-hover: #0047d6;
      --error: #d92d20;
      --success: #15803d;
      --card: #ffffff;
      --card-hover: #f1f1f4;
      --surface: #ececf0;
      --chip-bg: rgba(0, 0, 0, 0.06);
      --chip-on-accent-bg: rgba(255, 255, 255, 0.25);
      --chip-on-accent-fg: rgba(255, 255, 255, 0.92);
      --accent-soft-bg: rgba(0, 87, 255, 0.10);
      --accent-soft-border: rgba(0, 87, 255, 0.35);
      --accent-soft-fg: #0b43c0;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html {
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--background);
      color: var(--foreground);
      -webkit-font-smoothing: antialiased;
    }
    
    body {
      min-height: 100vh;
    }
    
    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--background);
      border-bottom: 1px solid var(--border);
    }
    
    .header-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 600;
      font-size: 18px;
      letter-spacing: -0.02em;
      color: var(--foreground);
      text-decoration: none;
    }
    
    .logo svg {
      width: 28px;
      height: 28px;
      fill: var(--foreground);
    }
    
    .header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    @media (max-width: 560px) {
      .header-inner { padding: 12px 16px; gap: 10px; flex-wrap: wrap; }
      .header-actions { gap: 8px; flex-wrap: wrap; }
      .logo { font-size: 16px; min-width: 0; }
      .logo svg { width: 22px; height: 22px; flex: none; }
      .stats { display: none; }
      .header-actions .btn { padding: 0 10px; }
      .header-actions .btn-primary span { display: none; }
    }
    
    .stats {
      font-size: 13px;
      color: var(--muted);
      font-family: 'SF Mono', 'Monaco', 'Inconsolata', monospace;
    }
    
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 36px;
      padding: 0 14px;
      font-size: 14px;
      font-weight: 500;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
      font-family: inherit;
    }
    
    .btn-primary {
      background: var(--foreground);
      color: var(--background);
    }
    
    .btn-primary:hover {
      opacity: 0.9;
    }
    
    .btn-secondary {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }
    
    .btn-secondary:hover {
      background: var(--card-hover);
      color: var(--foreground);
    }
    
    .btn-danger {
      background: transparent;
      color: var(--error);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    
    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.1);
      border-color: var(--error);
    }
    
    .btn svg {
      width: 16px;
      height: 16px;
    }
    
    /* Main Content */
    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 24px;
    }
    
    /* Search */
    .search-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 32px;
    }
    
    .search-input {
      flex: 1;
      height: 40px;
      padding: 0 16px;
      font-size: 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--foreground);
      outline: none;
      transition: border-color 0.15s ease;
      font-family: inherit;
    }
    
    .search-input::placeholder {
      color: var(--muted);
    }
    
    .search-input:focus {
      border-color: var(--text);
    }
    
    .search-input:focus-visible {
      box-shadow: 0 0 0 2px var(--background), 0 0 0 4px var(--accent);
    }
    
    select {
      height: 40px;
      padding: 0 12px;
      font-size: 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      outline: none;
      cursor: pointer;
      font-family: inherit;
    }
    
    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }
    
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      transition: all 0.2s ease;
    }
    
    .card:hover {
      background: var(--card-hover);
      border-color: var(--muted);
    }
    
    .card-thumb {
      position: relative;
      aspect-ratio: 16/9;
      overflow: hidden;
      background: #000;
    }
    
    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .card-duration {
      position: absolute;
      bottom: 8px;
      right: 8px;
      padding: 2px 6px;
      font-size: 11px;
      font-weight: 500;
      background: rgba(0, 0, 0, 0.8);
      border-radius: 4px;
      font-family: 'SF Mono', 'Monaco', monospace;
    }
    
    .card-body {
      padding: 16px;
    }
    
    .card-title {
      font-size: 15px;
      font-weight: 500;
      line-height: 1.4;
      color: var(--foreground);
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    
    .card-channel {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .card-channel-link {
      cursor: pointer;
    }

    .card-channel-link:hover {
      color: var(--fg, #fff);
      text-decoration: underline;
    }
    
    .card-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text);
      font-family: 'SF Mono', 'Monaco', monospace;
      margin-bottom: 12px;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 12px;
    }

    .tag-pill {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      white-space: nowrap;
    }

    .category-pill {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      background: var(--accent-soft-bg);
      border: 1px solid var(--accent-soft-border);
      color: var(--accent-soft-fg);
      font-weight: 500;
      white-space: nowrap;
    }

    /* Category filter bar */
    .category-filters {
      max-width: 1280px;
      margin: 0 auto;
      padding: 16px 24px 0;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    /* Chips clamp to a single row; the expander toggles full height */
    .category-chips {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      overflow: hidden;
      max-height: 34px;
    }

    .category-filters.expanded .category-chips {
      max-height: none;
    }

    .category-expand {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
    }

    .category-expand:hover {
      background: var(--card-hover);
      color: var(--foreground);
    }

    .category-expand svg {
      width: 14px;
      height: 14px;
      transition: transform 0.2s ease;
    }

    .category-filters.expanded .category-expand svg {
      transform: rotate(180deg);
    }

    .category-chip {
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .category-chip:hover {
      background: var(--card-hover);
      color: var(--foreground);
    }

    .category-chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .category-chip .count {
      opacity: 0.6;
      margin-left: 4px;
      font-size: 11px;
    }
    
    .card-actions {
      display: flex;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    
    .card-actions .btn {
      flex: 1;
      height: 32px;
      font-size: 13px;
    }
    
    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 80px 24px;
      color: var(--muted);
    }
    
    .empty-state svg {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
      opacity: 0.5;
    }
    
    .empty-state h3 {
      font-size: 18px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 8px;
    }
    
    .empty-state p {
      font-size: 14px;
      margin-bottom: 24px;
    }
    
    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    
    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow: auto;
    }
    
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
    }
    
    .modal-header h2 {
      font-size: 16px;
      font-weight: 600;
    }
    
    .modal-close {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      border-radius: 4px;
    }
    
    .modal-close:hover {
      background: var(--card-hover);
      color: var(--foreground);
    }
    
    .modal-body {
      padding: 24px;
    }
    
    .form-group {
      margin-bottom: 16px;
    }
    
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 6px;
    }
    
    .form-input {
      width: 100%;
      height: 40px;
      padding: 0 14px;
      font-size: 14px;
      background: var(--background);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--foreground);
      outline: none;
      font-family: inherit;
    }
    
    .form-input:focus {
      border-color: var(--text);
    }
    
    textarea.form-input {
      height: auto;
      padding: 12px 14px;
      resize: vertical;
      font-family: 'SF Mono', 'Monaco', monospace;
      font-size: 13px;
    }
    
    .form-error {
      color: var(--error);
      font-size: 13px;
      margin-top: 8px;
    }
    
    .modal-footer {
      display: flex;
      gap: 12px;
      padding: 20px 24px;
      border-top: 1px solid var(--border);
    }
    
    .modal-footer .btn {
      flex: 1;
      height: 40px;
    }
    
    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 200;
    }
    
    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }
    
    .toast-inner {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--foreground);
      color: var(--background);
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
    }
    
    .toast svg {
      width: 18px;
      height: 18px;
    }
    
    .toast-success svg { color: var(--success); }
    .toast-error svg { color: var(--error); }
    

    
    /* Channels Panel */
    .channels-panel {
      border-bottom: 1px solid var(--border);
      background: var(--background);
    }

    .channels-panel-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .channels-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 0;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      user-select: none;
      width: 100%;
      text-align: left;
      transition: color 0.15s ease;
    }

    .channels-toggle:hover {
      color: var(--text);
    }

    .channels-toggle-label {
      font-weight: 500;
    }

    .channels-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      font-size: 11px;
      font-weight: 600;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      font-family: 'SF Mono', 'Monaco', monospace;
    }

    .channels-chevron {
      margin-left: auto;
      width: 14px;
      height: 14px;
      transition: transform 0.2s ease;
      flex-shrink: 0;
    }

    .channels-chevron.open {
      transform: rotate(180deg);
    }

    .channels-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding-bottom: 12px;
    }

    .channels-list.hidden {
      display: none !important;
    }

    .channel-chip {
      display: inline-flex;
      align-items: stretch;
      height: 28px;
      font-size: 13px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      transition: border-color 0.15s ease;
    }

    .channel-chip:hover {
      border-color: var(--muted);
    }

    .channel-chip-filter {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 10px;
      color: var(--text);
      background: transparent;
      border: 0;
      cursor: pointer;
      font: inherit;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .channel-chip-filter:hover {
      background: var(--card-hover);
      color: var(--foreground);
    }

    .channel-chip.active {
      border-color: var(--accent, #0070f3);
    }

    .channel-chip.active .channel-chip-filter {
      background: var(--accent, #0070f3);
      color: #fff;
    }

    .channel-chip-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      color: var(--text);
      background: transparent;
      border: 0;
      border-left: 1px solid var(--border);
      text-decoration: none;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .channel-chip-link:hover {
      background: var(--card-hover);
      color: var(--foreground);
    }

    .channel-chip-link svg {
      width: 12px;
      height: 12px;
      opacity: 0.6;
      flex-shrink: 0;
    }

    .channel-chip-count {
      font-size: 11px;
      color: var(--muted);
      background: var(--chip-bg);
      padding: 0 6px;
      border-radius: 3px;
    }

    .channel-chip.active .channel-chip-count {
      color: var(--chip-on-accent-fg);
      background: var(--chip-on-accent-bg);
    }

    .channel-unsubscribe { cursor: pointer; font: inherit; }
    .channel-subscribe { display: inline-flex; gap: 6px; }
    .channel-subscribe input {
      width: 200px;
      min-width: 0;
      padding: 0 8px;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      font: inherit;
    }
    .channel-subscribe .btn { height: 28px; padding: 0 10px; font-size: 13px; }
    #channelsError { width: 100%; color: var(--danger, #f87171); font-size: 13px; }

    /* Hide */
    .hidden { display: none !important; }
    
    /* Mobile */
    @media (max-width: 640px) {
      .header-inner {
        padding: 12px 16px;
      }
      
      main {
        padding: 20px 16px;
      }
      
      .search-bar {
        flex-direction: column;
      }
      
      .grid {
        grid-template-columns: 1fr;
      }
    }
    /* Keyboard selection + Ctrl+K command menu (same keys as transcript page / Hypertask) */
    .card.kb-selected { border-color: #3ea6ff; box-shadow: 0 0 0 2px #3ea6ff; }
    #cmdk { border: 1px solid var(--border); border-radius: 10px; padding: 0; width: min(520px, calc(100vw - 32px)); background: var(--card); color: inherit; margin: 12vh auto auto; }
    #cmdk::backdrop { background: rgba(0,0,0,0.5); }
    #cmdkInput { width: 100%; box-sizing: border-box; padding: 14px 16px; font-size: 15px; background: transparent; color: inherit; border: none; border-bottom: 1px solid var(--border); outline: none; }
    #cmdkList { list-style: none; margin: 0; padding: 6px; max-height: 50vh; overflow-y: auto; }
    #cmdkList li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 10px; border-radius: 6px; cursor: pointer; font-size: 14px; }
    #cmdkList li.active { background: var(--card-hover); }
    #cmdkList kbd { font-family: 'SF Mono', Monaco, monospace; font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <div class="header-inner">
      <a href="/" class="logo">
        <svg viewBox="0 0 24 24">
          <path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/>
        </svg>
        ChromeScribe
      </a>
      
      <div class="header-actions">
        <span id="stats" class="stats"></span>
        <button id="themeToggle" class="btn btn-secondary" onclick="csTheme.cycle()" title="Theme" aria-label="Theme">◐</button>
        <a href="/subscriptions.html" class="btn btn-secondary">Subscriptions</a>
        <a href="/reports.html" class="btn btn-secondary">Reports</a>
        <a href="/stats.html" class="btn btn-secondary">Stats</a>
        <a href="/settings.html" class="btn btn-secondary" title="Settings" aria-label="Settings">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
        </a>
        <button onclick="openAddModal()" class="btn btn-primary">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
          </svg>
          <span>Add Video</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Monitored Channels -->
  <div class="channels-panel">
    <div class="channels-panel-inner">
      <button class="channels-toggle" onclick="toggleChannels()" id="channelsToggle" aria-expanded="false">
        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
        </svg>
        <span class="channels-toggle-label">Monitored Channels</span>
        <span class="channels-badge" id="channelsBadge">-</span>
        <svg class="channels-chevron" id="channelsChevron" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
        </svg>
      </button>
      <a href="/subscriptions.html" class="btn btn-secondary">Manage all</a>
      <div class="channels-list hidden" id="channelsList"></div>

  <!-- Category filters -->
  <div id="categoryFilters" class="category-filters">
    <div class="category-chips" id="categoryChips"></div>
    <button class="category-expand" id="categoryExpand" onclick="toggleCategories()" aria-expanded="false" title="Show all categories">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
    </button>
  </div>

  <!-- Main -->
  <main>
    <div class="search-bar">
      <input type="text" id="searchInput" class="search-input" placeholder="Search transcripts..." onkeyup="handleSearch(this.value)">
      <select id="sortSelect" onchange="renderTranscripts()">
        <option value="newest">Newest First</option>
        <option value="oldest">Oldest First</option>
        <option value="title">By Title</option>
        <option value="duration">By Duration</option>
      </select>
    </div>

    <div id="videoGrid" class="grid"></div>

    <div id="emptyState" class="empty-state hidden">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
      </svg>
      <h3>No transcriptions yet</h3>
      <p>Add your first video to start building your library</p>
      <button onclick="openAddModal()" class="btn btn-primary">Add Your First Video</button>
    </div>


  </main>

  <!-- Add Modal -->
  <div id="addModal" class="modal-backdrop hidden" onclick="if(event.target===this)closeAddModal()">
    <div class="modal">
      <div class="modal-header">
        <h2>Add Video</h2>
        <button class="modal-close" onclick="closeAddModal()">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <form id="addForm" onsubmit="handleAdd(event)">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label">Video URL</label>
            <input type="url" id="videoUrl" class="form-input" placeholder="YouTube or TikTok URL" required>
          </div>
          <div class="form-group">
            <label class="form-label">Title (optional)</label>
            <input type="text" id="videoTitle" class="form-input" placeholder="Custom title">
          </div>
          <div class="form-group">
            <label class="form-label">Channel (optional)</label>
            <input type="text" id="videoChannel" class="form-input" placeholder="Channel name">
          </div>
          <div class="form-group">
            <label class="form-label">Content (optional)</label>
            <textarea id="srtContent" class="form-input" rows="4" placeholder="Paste transcript content..."></textarea>
          </div>
          <div id="addError" class="form-error hidden"></div>
        </div>
        <div class="modal-footer">
          <button type="button" onclick="closeAddModal()" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="btn btn-primary">Add Video</button>
        </div>
      </form>
    </div>
  </div>

  <!-- View Modal -->
  <div id="viewModal" class="modal-backdrop hidden" onclick="if(event.target===this)closeViewModal()">
    <div class="modal" style="max-width: 800px; max-height: 90vh; display: flex; flex-direction: column;">
      <div class="modal-header">
        <div>
          <h2 id="viewTitle"></h2>
          <p id="viewMeta" style="font-size: 13px; color: var(--muted); margin-top: 4px;"></p>
        </div>
        <div style="display: flex; gap: 8px;">
          <a id="viewDownload" href="#" download class="btn btn-secondary">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
            </svg>
            Download
          </a>
          <button class="modal-close" onclick="closeViewModal()">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>
      </div>
      <div style="flex: 1; overflow: auto; padding: 24px;">
        <pre id="transcriptContent" style="font-family: 'SF Mono', 'Monaco', monospace; font-size: 13px; line-height: 1.7; white-space: pre-wrap; color: var(--text);"></pre>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast">
    <div class="toast-inner">
      <span id="toastIcon"></span>
      <span id="toastMessage"></span>
    </div>
  </div>

  <dialog id="cmdk">
    <input id="cmdkInput" placeholder="Type a command…" autocomplete="off">
    <ul id="cmdkList"></ul>
  </dialog>
  <script>
    const API_BASE = '/api';
    let transcripts = [];
    let activeCategory = null;
    let activeChannel = null; // canonical channel name or null

    // Keeps the theme button in step with the stored choice.
    window.csThemeRender = function () {
      var btn = document.getElementById('themeToggle');
      if (!btn) return;
      btn.textContent = csTheme.icon();
      btn.title = csTheme.label();
      btn.setAttribute('aria-label', csTheme.label());
    };
    csThemeRender();
    let channelsCache = [];
    let searchQuery = '';

    function saveScrollPosition() {
      try {
        sessionStorage.setItem('cs-list-scroll', String(window.scrollY));
      } catch (err) {}
    }

    function restoreScrollPosition() {
      requestAnimationFrame(() => {
        try {
          const saved = sessionStorage.getItem('cs-list-scroll');
          if (saved === null) return;
          window.scrollTo(0, Number(saved));
          sessionStorage.removeItem('cs-list-scroll');
        } catch (err) {}
      });
    }

    document.getElementById('videoGrid').addEventListener('click', e => {
      if (e.target.closest('a[href^="transcript.html"]')) saveScrollPosition();
    });

    window.addEventListener('pageshow', e => {
      if (e.persisted) restoreScrollPosition();
    });

    // Pinned clusters cut across the narrower model-generated categories. Match
    // title, channel, category, and tags so a relevant channel belongs to the
    // cluster even when one of its videos received an unexpected category.
    const ALL_AI_CLUSTER = '__all_ai__';
    const RUSSIA_CLUSTER = '__russia__';
    const HEALTH_CLUSTER = '__health__';
    const SEO_CLUSTER = '__seo__';

    const AI_TECH_CATEGORY_RE = /\bai\b|claude|vibe coding|programming|developer|software|consumer tech|cybersecurity|web development|system optimization|knowledge management|product design|open source|rag/i;
    const AI_TECH_CONTENT_RE = /\b(?:ai|artificial intelligence|machine learning|deep learning|llm|chatgpt|gpt(?:-?\d+)?|claude|gemini|codex|copilot|openai|anthropic|deepseek|qwen|mistral|grok|agentic|ai agents?|language models?|neural networks?|inference|prompting?|mcp|gpu|automation|robotics?|coding|programming|developers?|software|technology|tech|api|database|cloudflare|linux|cybersecurity|typescript|javascript|python|web development|no-code|saas)\b/i;
    const AI_TECH_CHANNEL_RE = /\b(?:ai|tech|code|coding|developer|software|cloudflare|jetbrains|posthog|figma|neuralnine|sentdex|fireship|aicodeking|worldofai|reysu|primetime|better stack|matt pocock|mo bitar|ray amjad|greg isenberg|lenny's podcast|jimmy reilly|income stream surfers|julian goldie|theo|t3|indydevdan|y combinator|simon willison|seangoedecke|jeff geerling|sabrina ramonov|turing post|caleb writes code|chris titus|craftzdog|practical it|mit media lab|superwhisper|warp)\b/i;
    const RUSSIA_RE = /\b(?:russia|russian|putin|kremlin|moscow|ukraine|ukrainian|kyiv|kiev|zelensky|soviet|donbas|crimea)\b/i;
    const HEALTH_CATEGORY_RE = /health|nutrition|diet|sports science|medicine|medical|food industry/i;
    const HEALTH_RE = /\b(?:health|medical|medicine|doctor|physician|nutrition|diet|metabolic|vitamin|supplement|protein|ketosis|carnivore|diabetes|insulin|blood pressure|cholesterol|longevity|sleep|exercise|fitness|cardio|strength training|body fat|obesity|cancer|disease|hormone|testosterone|mental health|neuroscience)\b/i;
    const HEALTH_CHANNEL_RE = /physionic|siim land|dr\.?\s|doctor|\bmd\b|health|nutrition|foundmyfitness|peter attia|paul saladino|steak and butter|butter bob|anthony chaffee|nick norwitz|felix harder|dan go/i;
    const SEO_RE = /\bseo\b|keyword|backlink|serp|search engine|on-page|link[- ]building|organic traffic|google search/i;

    function parsedTags(t) {
      if (!t.tags) return [];
      try {
        const tags = JSON.parse(t.tags);
        return Array.isArray(tags) ? tags.map(String) : [];
      } catch {
        return [];
      }
    }

    function clusterText(t) {
      return [t.title, t.channel, t.category, ...parsedTags(t)].filter(Boolean).join(' ');
    }

    function isAiTech(t) {
      return AI_TECH_CHANNEL_RE.test(t.channel || '') ||
        AI_TECH_CATEGORY_RE.test(t.category || '') ||
        AI_TECH_CONTENT_RE.test(clusterText(t));
    }

    function isRussia(t) {
      return RUSSIA_RE.test(clusterText(t));
    }

    function isHealth(t) {
      return HEALTH_CHANNEL_RE.test(t.channel || '') ||
        HEALTH_CATEGORY_RE.test(t.category || '') ||
        HEALTH_RE.test(clusterText(t));
    }

    function isSeo(t) {
      return SEO_RE.test(clusterText(t));
    }

    const PINNED_CLUSTERS = [
      { id: ALL_AI_CLUSTER, label: 'All AI', matches: isAiTech },
      { id: RUSSIA_CLUSTER, label: 'Russia', matches: isRussia },
      { id: HEALTH_CLUSTER, label: 'Health', matches: isHealth },
      { id: SEO_CLUSTER, label: 'SEO', matches: isSeo },
    ];

    function getActiveCluster() {
      return PINNED_CLUSTERS.find(cluster => cluster.id === activeCategory) || null;
    }

    document.addEventListener('DOMContentLoaded', () => {
      activeChannel = new URLSearchParams(window.location.search).get('channel') || null;
      loadTranscripts();
      loadCategories();
    });

    // Channel name on a card opens that channel's view instead of the video
    document.addEventListener('click', e => {
      const el = e.target.closest('.card-channel-link');
      if (!el || !el.dataset.channel) return;
      e.preventDefault();
      e.stopPropagation();
      if (activeChannel !== el.dataset.channel) toggleChannelFilter(el.dataset.channel);
    });

    async function loadTranscripts() {
      try {
        const res = await fetch(`${API_BASE}/transcripts`);
        const { data } = await res.json();
        transcripts = data || [];
        renderTranscripts();
        renderChannels();
        restoreScrollPosition();
        loadCategories(); // refresh chips so the SEO cluster count reflects loaded transcripts
      } catch (err) {
        showToast('Failed to load transcripts', 'error');
      }
    }

    async function loadCategories() {
      try {
        const res = await fetch(`${API_BASE}/categories`);
        const { data } = await res.json();
        renderCategoryFilters(data || []);
      } catch (err) {}
    }

    function renderCategoryFilters(categories) {
      const chipsBox = document.getElementById('categoryChips');
      const expandBtn = document.getElementById('categoryExpand');
      const total = transcripts.length;
      const pinnedChips = PINNED_CLUSTERS.map(cluster => {
        const count = transcripts.filter(cluster.matches).length;
        return `<button class="category-chip ${activeCategory === cluster.id ? 'active' : ''}" onclick="setCategory('${cluster.id}')">${cluster.label}<span class="count">${count}</span></button>`;
      });
      const chips = [
        `<button class="category-chip ${activeCategory === null ? 'active' : ''}" onclick="setCategory(null)">All<span class="count">${total}</span></button>`,
        ...pinnedChips,
        ...categories.map(c => `<button class="category-chip ${activeCategory === c.category ? 'active' : ''}" onclick="setCategory('${escapeAttr(c.category)}')">${escapeHtml(c.category)}<span class="count">${c.count}</span></button>`)
      ];
      chipsBox.innerHTML = chips.join('');

      // Restore the saved collapsed/expanded state
      const bar = document.getElementById('categoryFilters');
      const expanded = localStorage.getItem('cs-categories-expanded') === '1';
      bar.classList.toggle('expanded', expanded);
      expandBtn.setAttribute('aria-expanded', String(expanded));

      // Only show the expander when the chips actually overflow one row
      requestAnimationFrame(() => {
        expandBtn.classList.toggle('hidden', chipsBox.scrollHeight <= 44);
      });
    }

    function toggleCategories() {
      const bar = document.getElementById('categoryFilters');
      const btn = document.getElementById('categoryExpand');
      const open = bar.classList.toggle('expanded');
      btn.setAttribute('aria-expanded', String(open));
      localStorage.setItem('cs-categories-expanded', open ? '1' : '0');
    }

    function setCategory(cat) {
      activeCategory = cat;
      loadCategories();
      renderTranscripts();
    }

    function escapeAttr(s) {
      return String(s).replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    function renderTranscripts() {
      const grid = document.getElementById('videoGrid');
      const empty = document.getElementById('emptyState');

      if (transcripts.length === 0) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
        document.getElementById('stats').textContent = '';
        return;
      }

      empty.classList.add('hidden');

      const activeCluster = getActiveCluster();
      let filtered = activeCluster
        ? transcripts.filter(activeCluster.matches)
        : activeCategory
          ? transcripts.filter(t => t.category === activeCategory)
          : transcripts;
      if (activeChannel) {
        const n = activeChannel.toLowerCase();
        filtered = filtered.filter(t => {
          const c = (t.channel || '').toLowerCase();
          return c === n || c.startsWith(n);
        });
      }
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        filtered = filtered.filter(t => {
          if ((t.title || '').toLowerCase().includes(q)) return true;
          if ((t.channel || '').toLowerCase().includes(q)) return true;
          if ((t.category || '').toLowerCase().includes(q)) return true;
          if (t.tags) {
            try {
              const tags = JSON.parse(t.tags);
              if (Array.isArray(tags) && tags.some(x => String(x).toLowerCase().includes(q))) return true;
            } catch {}
          }
          return false;
        });
      }

      const sorted = [...filtered].sort((a, b) => {
        const sort = document.getElementById('sortSelect').value;
        if (sort === 'newest') return new Date(b.created_at) - new Date(a.created_at);
        if (sort === 'oldest') return new Date(a.created_at) - new Date(b.created_at);
        if (sort === 'title') return a.title.localeCompare(b.title);
        if (sort === 'duration') return b.duration - a.duration;
        return 0;
      });

      grid.innerHTML = sorted.map(t => `
        <div class="card">
          <a href="transcript.html?id=${t.id}" style="text-decoration: none; display: block;">
            ${t.video_id.startsWith('article:') ? '' : `<div class="card-thumb">
              <img src="${API_BASE}/thumb/${encodeURIComponent(t.video_id)}" alt="${escapeHtml(t.title)}" loading="lazy" decoding="async" onerror="this.onerror=null;this.style.background='#111';this.style.objectFit='none'">
              <span class="card-duration">${t.duration_formatted}</span>
            </div>`}
            <div class="card-body">
              <h3 class="card-title">${escapeHtml(t.title)}</h3>
              <p class="card-channel"><span class="card-channel-link" data-channel="${escapeHtml(t.channel || '')}" title="Show only this channel">${escapeHtml(t.channel)}</span></p>
              ${renderCardTags(t)}
              <div class="card-meta">
                <span>${t.word_count} words</span>
                <span>${t.created_at_formatted}</span>
              </div>
            </div>
          </a>
          <div class="card-actions" style="padding: 12px 16px;">
            <a href="transcript.html?id=${t.id}" class="btn btn-secondary" style="flex: 1; margin-right: 8px;">View</a>
            <a href="${t.video_id.startsWith('article:') ? '/api/transcripts/' + t.id + '/source' : t.video_id.startsWith('tiktok:') ? 'https://www.tiktok.com/video/' + t.video_id.replace('tiktok:', '') : t.video_id.startsWith('x:') ? 'https://x.com/i/status/' + t.video_id.replace('x:', '') : 'https://youtube.com/watch?v=' + t.video_id}" target="_blank" class="btn btn-secondary" style="width: 100px;">
              <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
              </svg>
              Open
            </a>
            <button type="button" class="btn btn-danger js-delete" data-id="${t.id}" data-title="${escapeHtml(t.title)}" style="width: 100px;">
              <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
              </svg>
              Delete
            </button>
          </div>
        </div>
      `).join('');

      const shown = sorted.length;
      const total = transcripts.length;
      document.getElementById('stats').textContent = (activeCategory || activeChannel)
        ? `${shown} of ${total} video${total !== 1 ? 's' : ''}`
        : `${total} video${total !== 1 ? 's' : ''}`;
    }

    function renderCardTags(t) {
      const parts = [];
      if (t.category) parts.push(`<span class="category-pill">${escapeHtml(t.category)}</span>`);
      let tags = [];
      if (t.tags) {
        try { tags = JSON.parse(t.tags); } catch { tags = []; }
      }
      tags.slice(0, 4).forEach(tag => {
        parts.push(`<span class="tag-pill">${escapeHtml(tag)}</span>`);
      });
      return parts.length ? `<div class="card-tags">${parts.join('')}</div>` : '';
    }

    async function viewTranscript(id) {
      const transcript = transcripts.find(t => t.id === id);
      if (!transcript) return;

      document.getElementById('viewTitle').textContent = transcript.title;
      document.getElementById('viewMeta').textContent = `${transcript.channel} · ${transcript.word_count} words`;
      document.getElementById('viewDownload').href = `${API_BASE}/transcript/${id}/content`;

      try {
        const res = await fetch(`${API_BASE}/transcript/${id}/content`);
        document.getElementById('transcriptContent').textContent = await res.text();
      } catch (err) {
        document.getElementById('transcriptContent').textContent = 'Failed to load transcript.';
      }

      document.getElementById('viewModal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeViewModal() {
      document.getElementById('viewModal').classList.add('hidden');
      document.body.style.overflow = '';
    }

    async function deleteTranscript(id, title) {
      if (!confirm(`Delete "${title}"?`)) return;
      try {
        const res = await fetch(`${API_BASE}/transcripts/${id}`, { method: 'DELETE', credentials: 'same-origin' });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || `HTTP ${res.status}`);
        }
        showToast('Deleted', 'success');
        loadTranscripts();
      } catch (err) {
        showToast('Failed to delete: ' + err.message, 'error');
      }
    }

    function openAddModal() {
      document.getElementById('addModal').classList.remove('hidden');
      document.getElementById('addForm').reset();
      document.getElementById('addError').classList.add('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeAddModal() {
      document.getElementById('addModal').classList.add('hidden');
      document.body.style.overflow = '';
    }

    async function handleAdd(e) {
      e.preventDefault();
      const error = document.getElementById('addError');
      const btn = e.target.querySelector('button[type="submit"]');
      
      btn.disabled = true;
      btn.textContent = 'Adding...';

      try {
        const res = await fetch(`${API_BASE}/transcribe`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            url: document.getElementById('videoUrl').value,
            title: document.getElementById('videoTitle').value,
            channel: document.getElementById('videoChannel').value,
            srt_content: document.getElementById('srtContent').value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        showToast('Added!', 'success');
        closeAddModal();
        loadTranscripts();
      } catch (err) {
        error.textContent = err.message;
        error.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Add Video';
      }
    }

    function handleSearch(query) {
      searchQuery = (query || '').trim();
      renderTranscripts();
    }

    document.addEventListener('click', e => {
      const btn = e.target.closest('.js-delete');
      if (!btn) return;
      e.preventDefault();
      e.stopPropagation();
      deleteTranscript(Number(btn.dataset.id), btn.dataset.title || '');
    });

    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      const icon = document.getElementById('toastIcon');
      icon.innerHTML = type === 'success' 
        ? '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>'
        : '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>';
      document.getElementById('toastMessage').textContent = message;
      toast.className = `toast toast-${type} show`;
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { closeAddModal(); closeViewModal(); }
    });

    // Keyboard shortcuts, following Hypertask's conventions (same as transcript page)
    let kbIndex = -1;
    const kbCards = () => [...document.querySelectorAll('#grid .card, .grid .card')];
    function kbSelect(i) {
      const cards = kbCards();
      if (!cards.length) return;
      kbIndex = Math.max(0, Math.min(i, cards.length - 1));
      cards.forEach((c, j) => c.classList.toggle('kb-selected', j === kbIndex));
      cards[kbIndex].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
    const kbCard = () => kbCards()[kbIndex];
    function kbOpen() { const a = kbCard()?.querySelector('a[href^="transcript.html"]'); if (a) { saveScrollPosition(); window.location.href = a.href; } }
    function kbOpenOriginal() { const a = kbCard()?.querySelector('.card-actions a[target="_blank"]'); if (a) window.open(a.href, '_blank', 'noopener'); }
    function kbDelete() { kbCard()?.querySelector('.js-delete')?.click(); }
    function focusSearch() { const s = document.getElementById('searchInput'); s.focus(); s.select(); }

    const COMMANDS = [
      { label: 'Next item', key: 'J', run: () => kbSelect(kbIndex + 1) },
      { label: 'Previous item', key: 'K', run: () => kbSelect(kbIndex - 1) },
      { label: 'Open selected', key: 'Enter', run: kbOpen, ok: () => !!kbCard() },
      { label: 'Open original of selected', key: 'O', run: kbOpenOriginal, ok: () => !!kbCard() },
      { label: 'Delete selected', key: '# / Del', run: kbDelete, ok: () => !!kbCard() },
      { label: 'Search', key: '/', run: focusSearch },
      { label: 'Add video', key: 'C', run: openAddModal },
      { label: 'Keyboard shortcuts', key: '?', run: () => openCmdk(true) },
      { label: 'Command menu', key: 'Ctrl+K', run: () => openCmdk() },
      { label: 'Stats', run: () => { window.location.href = '/stats.html'; } },
      { label: 'Settings', key: '$', run: () => { window.location.href = '/settings.html'; } },
    ];

    const cmdk = document.getElementById('cmdk');
    const cmdkInput = document.getElementById('cmdkInput');
    const cmdkList = document.getElementById('cmdkList');
    let cmdkItems = [], cmdkActive = 0, cmdkKeysOnly = false;
    function renderCmdk() {
      const q = cmdkInput.value.toLowerCase();
      cmdkItems = COMMANDS.filter(c => (!c.ok || c.ok()) && (!cmdkKeysOnly || c.key) && c.label.toLowerCase().includes(q));
      cmdkActive = Math.min(cmdkActive, Math.max(cmdkItems.length - 1, 0));
      cmdkList.innerHTML = cmdkItems.map((c, i) =>
        `<li data-i="${i}" class="${i === cmdkActive ? 'active' : ''}"><span>${c.label}</span><kbd>${c.key || ''}</kbd></li>`).join('');
    }
    function runCmdk(i) { const c = cmdkItems[i]; cmdk.close(); if (c) c.run(); }
    function openCmdk(keysOnly = false) {
      if (cmdk.open) cmdk.close();
      cmdkKeysOnly = keysOnly;
      cmdkInput.placeholder = keysOnly ? 'Keyboard shortcuts' : 'Type a command…';
      cmdkInput.value = '';
      cmdkActive = 0;
      renderCmdk();
      cmdk.showModal();
      cmdkInput.focus();
    }
    cmdkInput.addEventListener('input', () => { cmdkActive = 0; renderCmdk(); });
    cmdkInput.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown') { e.preventDefault(); cmdkActive = (cmdkActive + 1) % cmdkItems.length; renderCmdk(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); cmdkActive = (cmdkActive - 1 + cmdkItems.length) % cmdkItems.length; renderCmdk(); }
      else if (e.key === 'Enter') { e.preventDefault(); runCmdk(cmdkActive); }
    });
    cmdkList.addEventListener('click', e => { const li = e.target.closest('li'); if (li) runCmdk(+li.dataset.i); });
    cmdk.addEventListener('click', e => { if (e.target === cmdk) cmdk.close(); });

    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); cmdk.open ? cmdk.close() : openCmdk(); return; }
      if (cmdk.open || e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.target.matches('input, textarea, select, [contenteditable]')) {
        if (e.key === 'Escape') e.target.blur();
        return;
      }
      if (!document.getElementById('addModal').classList.contains('hidden')) return;
      const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
      if (k === 'j') { e.preventDefault(); kbSelect(kbIndex + 1); }
      else if (k === 'k') { e.preventDefault(); kbSelect(kbIndex - 1); }
      else if (k === 'Enter' && kbCard()) { e.preventDefault(); kbOpen(); }
      else if (k === 'o') { kbOpenOriginal(); }
      else if (k === '#' || k === 'Delete') { e.preventDefault(); kbDelete(); }
      else if (k === '/') { e.preventDefault(); focusSearch(); }
      else if (k === 'c') { e.preventDefault(); openAddModal(); }
      else if (k === '?') { e.preventDefault(); openCmdk(true); }
      else if (k === '$') { window.location.href = '/settings.html'; }
    });

    // Channels panel
    async function loadChannels() {
      const res = await fetch(`${API_BASE}/channels`);
      const { data, error } = await res.json();
      if (!res.ok || !Array.isArray(data)) throw new Error(error || 'Could not load channels');
      channelsCache = data;
      document.getElementById('channelsBadge').textContent = channelsCache.length;
      renderChannels();
    }

    async function subscribeChannel(e) {
      e.preventDefault();
      const form = e.target;
      const button = form.querySelector('button');
      const input = form.querySelector('input');
      button.disabled = true;
      document.getElementById('channelsError').textContent = '';
      try {
        const res = await fetch(`${API_BASE}/channels`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ input: input.value }),
        });
        const { error } = await res.json();
        if (!res.ok) throw new Error(error || 'Could not subscribe');
        await loadChannels();
      } catch (err) {
        document.getElementById('channelsError').textContent = err.message;
      } finally {
        button.disabled = false;
      }
    }

    async function unsubscribeChannel(id) {
      const channel = channelsCache.find(ch => ch.id === id);
      if (!channel || !confirm(`Unsubscribe from ${channel.name}? Existing transcripts will be kept.`)) return;
      document.getElementById('channelsError').textContent = '';
      try {
        const res = await fetch(`${API_BASE}/channels/${encodeURIComponent(id)}`, { method: 'DELETE' });
        const { error } = await res.json();
        if (!res.ok) throw new Error(error || 'Could not unsubscribe');
        await loadChannels();
      } catch (err) {
        document.getElementById('channelsError').textContent = err.message;
      }
    }

    function transcriptsByChannelName(name) {
      if (!name) return transcripts;
      const n = name.toLowerCase();
      return transcripts.filter(t => {
        const c = (t.channel || '').toLowerCase();
        return c === n || c.startsWith(n);
      });
    }

    function renderChannels() {
      const list = document.getElementById('channelsList');
      if (!list) return;
      list.innerHTML = channelsCache.map(ch => {
        const count = transcriptsByChannelName(ch.name).length;
        const isActive = activeChannel === ch.name;
        return `
          <span class="channel-chip ${isActive ? 'active' : ''}">
            <button type="button" class="channel-chip-filter" data-channel-id="${escapeHtml(ch.id)}" title="${isActive ? 'Clear filter' : 'Filter by ' + escapeHtml(ch.handle)}">
              ${escapeHtml(ch.handle)}
              <span class="channel-chip-count">${count}</span>
            </button>
            <a href="${ch.platform === 'tiktok' ? 'https://www.tiktok.com/' + encodeURIComponent(ch.handle) : 'https://www.youtube.com/channel/' + encodeURIComponent(ch.id)}" target="_blank" rel="noopener" class="channel-chip-link" title="Open on ${ch.platform === 'tiktok' ? 'TikTok' : 'YouTube'}">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
              </svg>
            </a>
            <button type="button" class="channel-chip-link channel-unsubscribe" data-channel-id="${escapeHtml(ch.id)}" title="Unsubscribe from ${escapeHtml(ch.name).replace(/"/g, '&quot;')}" aria-label="Unsubscribe from ${escapeHtml(ch.name).replace(/"/g, '&quot;')}">×</button>
          </span>
        `;
      }).join('') + `
        <form class="channel-subscribe" id="channelSubscribe">
          <input type="text" aria-label="Channel URL or handle" placeholder="Channel URL or @handle" required>
          <button type="submit" class="btn btn-secondary">Subscribe</button>
        </form>
        <span id="channelsError" role="alert"></span>
      `;
    }

    function toggleChannelFilter(name) {
      activeChannel = activeChannel === name ? null : name;
      // Keep ?channel= in the address so a channel view can be linked and reloaded
      const url = new URL(window.location.href);
      if (activeChannel) url.searchParams.set('channel', activeChannel); else url.searchParams.delete('channel');
      history.replaceState(null, '', url);
      window.scrollTo({ top: 0, behavior: 'smooth' });
      renderChannels();
      renderTranscripts();
      // open the panel if collapsed so the user sees the active state
      const list = document.getElementById('channelsList');
      if (activeChannel && list && list.classList.contains('hidden')) toggleChannels();
    }

    function toggleChannels() {
      const list = document.getElementById('channelsList');
      const chevron = document.getElementById('channelsChevron');
      const toggle = document.getElementById('channelsToggle');
      const isOpen = !list.classList.contains('hidden');
      list.classList.toggle('hidden', isOpen);
      chevron.classList.toggle('open', !isOpen);
      toggle.setAttribute('aria-expanded', String(!isOpen));
    }

    document.getElementById('channelsList').addEventListener('click', e => {
      const button = e.target.closest('button[data-channel-id]');
      if (!button) return;
      const id = button.dataset.channelId;
      if (button.classList.contains('channel-unsubscribe')) unsubscribeChannel(id);
      else {
        const channel = channelsCache.find(ch => ch.id === id);
        if (channel) toggleChannelFilter(channel.name);
      }
    });
    document.getElementById('channelsList').addEventListener('submit', subscribeChannel);
    document.addEventListener('DOMContentLoaded', () => {
      renderChannels();
      loadChannels().catch(err => { document.getElementById('channelsError').textContent = err.message; });
    });
  </script>
</body>
</html>
