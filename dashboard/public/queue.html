<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Queue · ChromeScribe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --foreground: #fff;
      --background: #030303;
      --border: #27272a;
      --muted: #71717a;
      --text: #a1a1aa;
      --accent: #0057ff;
      --accent-hover: #0066ff;
      --error: #ef4444;
      --success: #22c55e;
      --card: #090909;
      --card-hover: #111111;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--background);
      color: var(--foreground);
      -webkit-font-smoothing: antialiased;
    }
    body { min-height: 100vh; }

    header {
      position: sticky; top: 0; z-index: 50;
      background: var(--background);
      border-bottom: 1px solid var(--border);
    }
    .header-inner {
      max-width: 900px; margin: 0 auto;
      padding: 16px 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo {
      display: flex; align-items: center; gap: 12px;
      font-weight: 600; font-size: 18px;
      letter-spacing: -0.02em;
      color: var(--foreground); text-decoration: none;
    }
    .logo svg { width: 28px; height: 28px; fill: var(--foreground); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 8px; height: 36px; padding: 0 14px;
      font-size: 14px; font-weight: 500;
      border: none; border-radius: 6px; cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none; font-family: inherit;
      background: var(--card); color: var(--text);
      border: 1px solid var(--border);
    }
    .btn:hover { background: var(--card-hover); color: var(--foreground); }

    main {
      max-width: 900px; margin: 0 auto;
      padding: 48px 24px 96px;
    }

    h1 {
      font-size: 32px; font-weight: 600;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }
    .subtitle {
      color: var(--muted); font-size: 15px;
      margin-bottom: 48px;
    }

    .header-inner, nav { display: flex; flex-wrap: wrap; gap: 12px; }
    .subtitle { margin-bottom: 24px; }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .failure { color: var(--error); margin: 8px 0; white-space: pre-wrap; }
    .notice { min-height: 24px; font-size: 14px; margin: 8px 0; color: var(--success); }
    #error { color: var(--error); }
    #count, .meta, .empty { color: var(--text); font-size: 14px; }
    h2 { font-size: 18px; margin: 24px 0 8px; }
    .channel-row {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 16px; background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; margin-bottom: 8px;
    }
    .channel-info { min-width: 0; overflow-wrap: anywhere; }
    .channel-name { font-weight: 500; margin-bottom: 6px; }
    .channel-name a { color: var(--foreground); text-decoration: none; }
    .channel-name a:hover { text-decoration: underline; }
    .meta { display: flex; flex-wrap: wrap; gap: 12px; }
    .meta a { color: var(--text); }
    .meta a:hover { color: var(--foreground); }
    .actions { display: flex; gap: 8px; flex-shrink: 0; }
    .btn:disabled { opacity: 0.5; cursor: wait; }
    .remove { color: var(--error); }
    .empty { padding: 24px 0; }
    @media (max-width: 600px) {
      main { padding: 32px 16px; }
      .header-inner { padding: 16px; }
      .channel-row { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="/" class="logo">
        <svg viewBox="0 0 24 24">
          <path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/>
        </svg>
        ChromeScribe
      </a>
      <nav aria-label="Main navigation">
        <a href="/subscriptions.html" class="btn">Subscriptions</a>
        <a href="/reports.html" class="btn">Reports</a>
        <a href="/stats.html" class="btn">Stats</a>
        <a href="/settings.html" class="btn">Settings</a>
        <a href="/" class="btn">← Back</a>
      </nav>
    </div>
  </header>

  <main>
    <h1>Queue</h1>
    <p class="subtitle">Downloads and transcriptions shared from your devices. Showing the newest 200 entries.</p>
    <p id="error" class="notice" role="alert"></p>
    <p id="count" role="status">Loading queue...</p>
    <section aria-labelledby="processingHeading"><h2 id="processingHeading">In progress</h2><div id="processing"></div></section>
    <section aria-labelledby="pendingHeading"><h2 id="pendingHeading">Waiting</h2><div id="pending"></div></section>
    <section aria-labelledby="failedHeading"><h2 id="failedHeading">Failed</h2><div id="failed"></div></section>
    <section aria-labelledby="doneHeading"><h2 id="doneHeading">Done recently</h2><div id="done"></div></section>
  </main>
  <script>
    let rows = [];
    let loading = false;

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[char]));
    }

    function dateValue(value) {
      if (!value) return NaN;
      return Date.parse(/Z$|[+-]\d\d:\d\d$/.test(value) ? value : value.replace(' ', 'T') + 'Z');
    }

    function relativeTime(value) {
      const seconds = Math.max(0, Math.floor((Date.now() - dateValue(value)) / 1000));
      if (!Number.isFinite(seconds)) return 'Not recorded';
      if (seconds < 60) return 'just now';
      if (seconds < 3600) return `${Math.floor(seconds / 60)} min ago`;
      if (seconds < 86400) return `${Math.floor(seconds / 3600)} hr ago`;
      return `${Math.floor(seconds / 86400)} days ago`;
    }

    function timeLabel(label, value) {
      return `<span title="${escapeHtml(value || 'Not recorded')}">${escapeHtml(label)}: ${escapeHtml(relativeTime(value))}</span>`;
    }

    function renderRow(row, position) {
      const platform = row.video_id?.startsWith('tiktok') ? 'TikTok' : row.video_id?.startsWith('article:') ? 'Article' : 'YouTube';
      const title = escapeHtml(row.title || row.url);
      const linkedTitle = row.status === 'done' && Number.isSafeInteger(row.transcript_id) && row.transcript_id > 0 ?
        `<a href="/transcript.html?id=${encodeURIComponent(row.transcript_id)}">${title}</a>` : title;
      return `<div class="channel-row">
        <div class="channel-info">
          <p class="channel-name">${position ? `#${escapeHtml(position)} ` : ''}${linkedTitle}</p>
          <div class="meta">
            <span>${escapeHtml(platform)}</span>
            ${row.channel ? `<span>${escapeHtml(row.channel)}</span>` : ''}
            ${row.status === 'pending' ? `<span>${platform === 'TikTok' ? 'runs on the laptop' : 'runs on the server'}</span>` : ''}
            ${timeLabel('Added', row.created_at)}
            ${timeLabel('Started', row.started_at)}
            ${timeLabel('Finished', row.finished_at)}
          </div>
          ${row.status === 'failed' ? `<p class="failure">${escapeHtml(row.error || 'No error recorded')}</p><p class="meta">Attempts: ${escapeHtml(row.attempts ?? 0)}</p>` : ''}
        </div>
        ${row.status === 'failed' ? `<div class="actions">
          <button class="btn" data-action="retry" data-id="${escapeHtml(row.id)}">Retry</button>
          <button class="btn remove" data-action="remove" data-id="${escapeHtml(row.id)}">Remove</button>
        </div>` : ''}
      </div>`;
    }

    function renderQueue() {
      document.getElementById('count').textContent = `${rows.length} queue entries`;
      for (const status of ['processing', 'pending', 'failed', 'done']) {
        let group = rows.filter(row => row.status === status);
        if (status === 'pending') group.sort((a, b) => dateValue(a.created_at) - dateValue(b.created_at) || a.id - b.id);
        if (status === 'done') {
          group.sort((a, b) => dateValue(b.finished_at || b.created_at) - dateValue(a.finished_at || a.created_at) || b.id - a.id);
          group = group.slice(0, 30);
        }
        document.getElementById(status).innerHTML = group.map((row, index) => renderRow(row, status === 'pending' ? index + 1 : null)).join('') || '<p class="empty">Nothing here.</p>';
      }
    }

    async function queueRequest(path, options = {}) {
      const response = await fetch('/api/queue' + path, { ...options, credentials: 'include' });
      const payload = await response.json();
      if (!response.ok || !payload.success) throw new Error(payload.error || 'Queue request failed');
      return payload.data;
    }

    async function loadQueue() {
      if (loading) return;
      loading = true;
      try {
        const data = await queueRequest('/all?limit=200');
        if (!Array.isArray(data)) throw new Error('Could not load queue');
        rows = data;
        renderQueue();
        document.getElementById('error').textContent = '';
      } catch (err) {
        document.getElementById('error').textContent = err.message;
        if (!rows.length) document.getElementById('count').textContent = 'Queue unavailable';
      } finally {
        loading = false;
      }
    }

    async function changeQueue(event) {
      const button = event.target.closest('button[data-action]');
      if (!button || button.disabled) return;
      const remove = button.dataset.action === 'remove';
      if (remove && !confirm('Remove this failed queue entry?')) return;
      button.disabled = true;
      try {
        await queueRequest('/' + encodeURIComponent(button.dataset.id), remove ? { method: 'DELETE' } : {
          method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: 'pending' }),
        });
        await loadQueue();
      } catch (err) {
        document.getElementById('error').textContent = err.message;
      } finally {
        button.disabled = false;
      }
    }

    document.getElementById('failed').addEventListener('click', changeQueue);
    setInterval(() => { if (!document.hidden) loadQueue(); }, 15000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) loadQueue(); });
    if (!document.hidden) loadQueue();
  </script>
</body>
</html>
