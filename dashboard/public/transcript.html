<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transcript - ChromeScribe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f0f0f;
      color: #fff;
    }
    
    .container {
      display: flex;
      height: 100vh;
    }
    
    .video-side {
      flex: 1;
      background: #000;
      display: flex;
      flex-direction: column;
    }
    
    .header {
      padding: 12px 16px;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .logo {
      font-weight: 600;
      font-size: 16px;
      color: #fff;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .logo svg { width: 24px; height: 24px; fill: #fff; }
    
    .header-btns {
      display: flex;
      gap: 8px;
    }
    
    .btn {
      padding: 6px 12px;
      font-size: 13px;
      background: #333;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    
    .btn:hover { background: #444; }
    
    .video-wrapper {
      flex: 1;
      position: relative;
    }
    
    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    
    .video-info {
      padding: 12px 16px;
      background: #1a1a1a;
    }
    
    .video-title {
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 4px;
    }
    
    .video-meta {
      font-size: 12px;
      color: #888;
    }
    
    .transcript-side {
      width: 400px;
      min-width: 300px;
      background: #181818;
      border-left: 1px solid #333;
      display: flex;
      flex-direction: column;
    }
    
    .transcript-header {
      padding: 12px 16px;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      font-weight: 500;
      font-size: 14px;
    }
    
    .transcript-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      font-size: 14px;
      line-height: 1.6;
    }
    
    .transcript-content h2 {
      font-size: 16px;
      margin: 16px 0 8px;
    }
    
    .transcript-content h3 {
      font-size: 14px;
      margin: 12px 0 6px;
    }
    
    .transcript-content p {
      margin-bottom: 8px;
    }
    
    .transcript-content ul {
      margin: 8px 0;
      padding-left: 20px;
    }
    
    .transcript-content li {
      margin-bottom: 4px;
    }
    
    .transcript-content strong { color: #fff; }
    .transcript-content a { color: #3ea6ff; }
    
    .transcript-content blockquote {
      border-left: 2px solid #444;
      padding-left: 12px;
      margin: 12px 0;
      color: #888;
      font-style: italic;
    }
    
    .transcript-content hr {
      border: none;
      border-top: 1px solid #333;
      margin: 16px 0;
    }
    
    .transcript-content details {
      border: 1px solid #333;
      margin: 12px 0;
    }
    
    .transcript-content details summary {
      padding: 10px;
      cursor: pointer;
      font-weight: 500;
    }
    
    .transcript-content details > *:not(summary) {
      padding: 10px;
    }
    
    .loading {
      padding: 40px;
      text-align: center;
      color: #888;
    }
    
    .error {
      padding: 40px;
      text-align: center;
      color: #f55;
    }
    
    .error a { color: #3ea6ff; }
    
    @media (max-width: 768px) {
      .container { flex-direction: column; }
      .video-side { height: 50vh; }
      .transcript-side { width: 100%; flex: 1; border-left: none; border-top: 1px solid #333; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="video-side">
      <header class="header">
        <a href="/" class="logo">
          <svg viewBox="0 0 24 24"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg>
          ChromeScribe
        </a>
        <div class="header-btns">
          <button class="btn" onclick="copyText()">Copy</button>
          <button class="btn" onclick="downloadMd()">Download MD</button>
        </div>
      </header>
      <div class="video-wrapper">
        <iframe id="video" src="" allowfullscreen></iframe>
      </div>
      <div class="video-info">
        <h1 class="video-title" id="title"></h1>
        <p class="video-meta" id="meta"></p>
      </div>
    </div>
    
    <div class="transcript-side">
      <div class="transcript-header">Transcript</div>
      <div class="transcript-content" id="content">
        <div class="loading">Loading...</div>
      </div>
    </div>
  </div>
  
  <script>
    const API = '/api';
    let markdown = '';
    
    async function init() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      
      if (!id) {
        showError('No transcript ID provided');
        return;
      }
      
      try {
        // Get metadata
        const metaRes = await fetch(API + '/transcripts/' + id);
        if (!metaRes.ok) throw new Error('Not found');
        const meta = (await metaRes.json()).data;
        
        // Get content
        const contentRes = await fetch(API + '/transcript/' + id + '/content');
        if (!contentRes.ok) throw new Error('Content not found');
        markdown = await contentRes.text();
        
        // Render
        if (meta.video_id.startsWith('tiktok:')) {
          const tiktokId = meta.video_id.replace('tiktok:', '');
          const wrapper = document.querySelector('.video-wrapper');
          wrapper.innerHTML = meta.thumbnail_url
            ? '<a href="https://www.tiktok.com/video/' + tiktokId + '" target="_blank" style="display:block;width:100%;height:100%"><img src="' + meta.thumbnail_url + '" style="width:100%;height:100%;object-fit:contain;" alt="TikTok video thumbnail"></a>'
            : '<a href="https://www.tiktok.com/video/' + tiktokId + '" target="_blank" style="display:flex;align-items:center;justify-content:center;height:100%;color:#888;text-decoration:none;">Click to watch on TikTok</a>';
        } else {
          document.getElementById('video').src = 'https://www.youtube.com/embed/' + meta.video_id;
        }
        document.getElementById('title').textContent = meta.title;
        document.getElementById('meta').textContent = meta.channel + ' • ' + meta.word_count.toLocaleString() + ' words';
        document.getElementById('content').innerHTML = parseMarkdown(markdown);
        
      } catch (e) {
        showError(e.message);
      }
    }
    
    function parseMarkdown(text) {
      return text
        .replace(/^# .+$/gm, '') // Remove main title
        .replace(/^## (.+)$/gm, '<h2>$1</h2>')
        .replace(/^### (.+)$/gm, '<h3>$1</h3>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        .replace(/`(.+?)`/g, '<code>$1</code>')
        .replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2" target="_blank">$1</a>')
        .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
        .replace(/^---$/gm, '<hr>')
        .replace(/^- (.+)$/gm, '<li>$1</li>')
        .replace(/(<li>.+<\/li>)+/g, '<ul>$&</ul>')
        .replace(/\n\n/g, '</p><p>')
        .replace(/^(?!<[hupbld])(.+)$/gm, '<p>$1</p>')
        .replace(/<p><\/p>/g, '');
    }
    
    function showError(msg) {
      document.getElementById('content').innerHTML = '<div class="error"><p>' + msg + '</p><a href="/">Back to Dashboard</a></div>';
    }
    
    function copyText() {
      navigator.clipboard.writeText(markdown);
    }
    
    function downloadMd() {
      const blob = new Blob([markdown], { type: 'text/markdown' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'transcript.md';
      a.click();
    }
    
    init();
  </script>
</body>
</html>
