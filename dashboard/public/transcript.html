<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transcript - ChromeScribe</title>
  <script>
    (function () {
      var KEY = 'cs-theme';
      var ORDER = ['system', 'dark', 'light'];
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      function choice() {
        try {
          var v = localStorage.getItem(KEY);
          return ORDER.indexOf(v) === -1 ? 'system' : v;
        } catch (e) { return 'system'; }
      }
      function paint(c) {
        var root = document.documentElement;
        root.setAttribute('data-theme', c === 'system' ? (mq.matches ? 'dark' : 'light') : c);
        root.setAttribute('data-theme-choice', c);
      }
      window.csTheme = {
        get: choice,
        icon: function () { var c = choice(); return c === 'system' ? '◐' : c === 'dark' ? '☀' : '🌙'; },
        label: function () { return 'Theme: ' + choice(); },
        set: function (c) {
          try { localStorage.setItem(KEY, c); } catch (e) {}
          paint(c);
          if (window.csThemeRender) window.csThemeRender();
        },
        cycle: function () { window.csTheme.set(ORDER[(ORDER.indexOf(choice()) + 1) % ORDER.length]); }
      };
      mq.addEventListener('change', function () { if (choice() === 'system') paint('system'); });
      paint(choice());
    })();
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;

      background: #000;
      display: flex;
      flex-direction: column;

      justify-content: flex-end;
      gap: 8px;
    }

    }
    
    .btn:hover { background: #444; }
    
    .btn-retranscribe {

    }
    
    .btn-retranscribe:hover {
      background: #3d7a3d;
    }
    
    .btn-retranscribe:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-danger {
      background: #5a2d2d;
    }

    .btn-danger:hover {
      background: #7a3d3d;
    }

    .btn-summarize {
      background: #3a2d5a;
    }

    .btn-summarize:hover {
      background: #4d3d7a;
    }

    .btn-summarize:disabled {

      cursor: not-allowed;
    }

    .summarize-banner {

    }

    }

      display: flex;

      background: #000;

      position: absolute;
      top: 0;
      left: 0;
    }
    
    .video-placeholder {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      font-size: 12px;
      text-transform: uppercase;

      color: #888;
      margin-bottom: 16px;

      line-height: 1.4;
      margin-bottom: 16px;

      height: 48px;

      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 12px;

      align-items: center;

      z-index: 1;

    .play-btn:hover {

    }
    
    .play-btn svg {
      width: 20px;
      height: 20px;
      fill: #fff;
      margin-left: 3px;
    }
    
    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: none;
    }
    
    .video-wrapper.playing .video-thumbnail,
    .video-wrapper.playing .video-placeholder,
    .video-wrapper.playing .play-btn {
      display: none;
    }
    
    .video-wrapper.playing iframe {
      display: block;
    }

    .article-reader { flex: 1; overflow-y: auto; background: #181818; display: none; justify-content: center; }
    .article-reader .transcript-content { flex: none; overflow: visible; max-width: 760px; width: 100%; padding: 32px 24px; font-size: 16px; line-height: 1.7; }
    .open-original { display: inline-block; margin-top: 8px; padding: 6px 14px; background: #3ea6ff; color: #000; border-radius: 6px; font-weight: 500; text-decoration: none; font-size: 14px; }
    .open-original:hover { background: #5ab6ff; }
    [data-theme="light"] .article-reader { background: #fafafa; }

    .video-info {
      padding: 12px 16px;
      background: #1a1a1a;
    }
    
    .video-title {
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 4px;
    }
    
    .video-meta {
      font-size: 12px;
      color: #888;
    }

    .channel-link {
      color: inherit;
      text-decoration: none;
    }

    .channel-link:hover {
      color: #fff;
      text-decoration: underline;
    }

    .video-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .video-tags .tag-pill {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      background: #1a1a1a;
      border: 1px solid #333;
      color: #aaa;
    }

    .video-tags .category-pill {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      background: rgba(0, 87, 255, 0.15);
      border: 1px solid rgba(0, 87, 255, 0.4);
      color: #6ea8ff;
      font-weight: 500;
    }
    
    .transcript-side {
      width: 400px;
      min-width: 300px;
      background: #181818;
      border-left: 1px solid #333;
      display: flex;
      flex-direction: column;
    }
    
    .transcript-header {
      padding: 12px 16px;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      font-weight: 500;
      font-size: 14px;
    }
    
    .transcript-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      font-size: 14px;
      line-height: 1.6;
    }
    
    .transcript-content h2 {
      font-size: 16px;
      margin: 16px 0 8px;
    }
    
    .transcript-content h3 {
      font-size: 14px;
      margin: 12px 0 6px;
    }
    
    .transcript-content p {
      margin-bottom: 8px;
    }
    
    .transcript-content ul,
    .transcript-content ol {
      margin: 8px 0;
      padding-left: 20px;
    }

    .transcript-content li {
      margin-bottom: 4px;
    }
    
    .transcript-content strong { color: #fff; }
    .transcript-content a { 
      color: #3ea6ff; 
      text-decoration: none;
      word-break: break-all;
    }
    .transcript-content a:hover { 
      text-decoration: underline;
    }
    
    .transcript-content blockquote {
      border-left: 2px solid #444;
      padding-left: 12px;
      margin: 12px 0;
      color: #888;
      font-style: italic;
    }
    
    .transcript-content hr {
      border: none;
      border-top: 1px solid #333;
      margin: 16px 0;
    }
    
    .transcript-content details {
      border: 1px solid #333;
      margin: 12px 0;
    }
    
    .transcript-content details summary {
      padding: 10px;
      cursor: pointer;
      font-weight: 500;
    }
    
    .transcript-content details > *:not(summary) {
      padding: 10px;
    }
    
    .loading {
      padding: 40px;
      text-align: center;
      color: #888;
    }
    
    .error {
      padding: 40px;
      text-align: center;
      color: #f55;
    }
    
    .error a { color: #3ea6ff; }
    
    .nav-btn {
      min-width: 32px;
      padding: 6px 10px;
      font-weight: 600;
    }
    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .nav-bar { display: none; }
    .back-btn,
    .menu-toggle,
    .mobile-tabs,
    .mobile-summary { display: none; }
    .nav-chat { background: var(--accent, #0057ff); border-color: var(--accent, #0057ff); color: #fff; font-size: 13px; white-space: nowrap; }
    .nav-chat:hover:not(:disabled) { background: #0066ff; }
    .nav-fab {
      flex: 1;
      min-height: 48px;
      max-width: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 16px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }
    .nav-fab:hover:not(:disabled) { background: #3a3a3a; }
    .nav-fab:active:not(:disabled) { background: #4a4a4a; }
    .nav-fab:disabled { opacity: 0.3; cursor: not-allowed; }
    .nav-fab svg { width: 22px; height: 22px; fill: currentColor; }
    .nav-counter {
      font-size: 12px;
      color: #888;
      min-width: 56px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    [data-theme="light"] html,
    [data-theme="light"] body { background: #ffffff; color: #111; }
    [data-theme="light"] .header,
    [data-theme="light"] .video-info,
    [data-theme="light"] .transcript-header { background: #f5f5f5; border-color: #e0e0e0; }
    [data-theme="light"] .transcript-side { background: #fafafa; border-left-color: #e0e0e0; border-top-color: #e0e0e0; }
    [data-theme="light"] .header { border-bottom-color: #e0e0e0; }
    [data-theme="light"] .logo,
    [data-theme="light"] .video-title,
    [data-theme="light"] .transcript-content strong { color: #111; }
    [data-theme="light"] .logo svg { fill: #111; }
    [data-theme="light"] .video-meta { color: #555; }
    [data-theme="light"] .btn { background: #e8e8e8; color: #111; }
    [data-theme="light"] .btn:hover { background: #dcdcdc; }
    [data-theme="light"] .btn-retranscribe { background: #cfe9cf; color: #1a4a1a; }
    [data-theme="light"] .btn-retranscribe:hover { background: #b8dcb8; }
    [data-theme="light"] .btn-danger { background: #f4cccc; color: #5a1a1a; }
    [data-theme="light"] .btn-danger:hover { background: #e8b8b8; }
    [data-theme="light"] .btn-summarize { background: #e2d9f5; color: #3a2d5a; }
    [data-theme="light"] .btn-summarize:hover { background: #d4c7ef; }
    [data-theme="light"] .summarize-banner { background: rgba(91, 63, 179, 0.08); border-color: rgba(91, 63, 179, 0.3); color: #5b3fb3; }
    [data-theme="light"] .video-tags .tag-pill { background: #f0f0f0; border-color: #d8d8d8; color: #555; }
    [data-theme="light"] .transcript-content { color: #222; }
    [data-theme="light"] .transcript-content a { color: #1565c0; }
    [data-theme="light"] .transcript-content blockquote { border-left-color: #ccc; color: #555; }
    [data-theme="light"] .transcript-content hr,
    [data-theme="light"] .transcript-content details { border-color: #e0e0e0; }
    [data-theme="light"] .nav-bar {
      background: rgba(255, 255, 255, 0.95);
      border-top-color: #e0e0e0;
    }
    [data-theme="light"] .nav-fab {
      background: #f0f0f0;
      border-color: #d8d8d8;
      color: #111;
    }
    [data-theme="light"] .nav-fab:hover:not(:disabled) { background: #e0e0e0; }
    [data-theme="light"] .nav-counter { color: #555; }
    [data-theme="light"] .video-side,
    [data-theme="light"] .video-wrapper { background: #000; }
    [data-theme="light"] .mobile-tabs { background: #ffffff; border-bottom-color: #e0e0e0; }
    [data-theme="light"] .mobile-tab { color: #555; }
    [data-theme="light"] .mobile-tab.active { color: #111; border-bottom-color: #0057ff; }
    [data-theme="light"] .mobile-summary { color: #222; }
    [data-theme="light"] .mobile-summary h1,
    [data-theme="light"] .mobile-summary h2,
    [data-theme="light"] .mobile-summary h3,
    [data-theme="light"] .mobile-summary strong { color: #111; }
    [data-theme="light"] .mobile-summary a { color: #1565c0; }
    [data-theme="light"] .header-btns { background: #ffffff; border-color: #ddd; }
    [data-theme="light"] .back-btn,
    [data-theme="light"] .menu-toggle { color: #111; }
    [data-theme="light"] .back-btn:hover,
    [data-theme="light"] .menu-toggle:hover { background: rgba(0, 0, 0, 0.06); }

    @media (max-width: 768px) {
      :root { --accent: #0057ff; }
      .container { flex-direction: column; height: auto; min-height: 100vh; }
      .back-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        padding: 0;
        border-radius: 999px;
        background: transparent;
        border: none;
        color: #fff;
        font-size: 20px;
        text-decoration: none;
        flex: none;
      }
      .back-btn:hover { background: rgba(255, 255, 255, 0.08); }
      .logo { display: none; }
      .header { padding: 8px 12px; gap: 8px; flex-wrap: nowrap; position: relative; }
      .header-btns {
        display: none;
        position: absolute;
        top: 100%;
        left: 8px;
        right: 8px;
        z-index: 60;
        grid-template-columns: repeat(2, 1fr);
        padding: 8px;
        background: #1f1f1f;
        border: 1px solid #333;
        border-radius: 14px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      }
      .header.menu-open .header-btns { display: grid; }
      .header-btns .overflow { display: contents; }
      .header-btns .overflow > .btn { display: none; }
      .header-btns .overflow .overflow-panel {
        display: contents;
        position: static;
        min-width: 0;
        padding: 0;
        border: none;
        background: transparent;
        box-shadow: none;
      }
      .header-btns .overflow-panel .btn { border-radius: 10px; }
      .menu-toggle {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        margin-left: auto;
        padding: 0;
        border: none;
        border-radius: 999px;
        background: transparent;
        color: #fff;
        font-size: 20px;
        cursor: pointer;
      }
      .menu-toggle:hover { background: rgba(255, 255, 255, 0.08); }
      .btn { font-size: 13px; padding: 10px 6px; text-align: center; border-radius: 10px; }
      .desktop-only { display: none !important; }
      .video-info { padding: 14px 16px 12px; }
      .video-title { font-size: 20px; line-height: 1.25; margin-bottom: 6px; }
      .video-meta { font-size: 12px; }
      .video-tags { margin-top: 8px; }
      .video-tags .tag-pill { display: none; }
      .video-tags .category-pill {
        padding: 0;
        border: none;
        background: none;
        color: #6ea8ff;
        font-size: 12px;
      }
      .mobile-tabs {
        display: flex;
        gap: 4px;
        padding: 8px 12px 0;
        background: #181818;
        border-bottom: 1px solid #333;
        position: sticky;
        top: 56.25vw;
        z-index: 38;
      }
      .mobile-tab {
        flex: 1;
        padding: 10px 12px 12px;
        background: none;
        border: none;
        border-bottom: 2px solid transparent;
        color: #888;
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
      }
      .mobile-tab.active { color: #fff; border-bottom-color: #0057ff; }
      .mobile-summary {
        display: block;
        padding: 16px;
        font-size: 15px;
        line-height: 1.6;
        color: #ddd;
      }
      .mobile-summary h1,
      .mobile-summary h2,
      .mobile-summary h3 { font-size: 15px; margin: 14px 0 6px; color: #fff; }
      .mobile-summary p { margin-bottom: 8px; }
      .mobile-summary ul,
      .mobile-summary ol { margin: 8px 0; padding-left: 20px; }
      .mobile-summary li { margin-bottom: 4px; }
      .mobile-summary strong { color: #fff; }
      .mobile-summary a { color: #3ea6ff; text-decoration: none; }
      .mobile-summary .empty-summary { color: #888; }
      .transcript-side[data-tab="summary"] .transcript-content { display: none; }
      .transcript-side[data-tab="transcript"] .mobile-summary { display: none; }
      .transcript-side[data-tab="transcript"] .transcript-header { display: block; }
      .transcript-header { display: none; }
      .video-side { display: contents; }
      .video-wrapper {
        flex: none;
        width: 100%;
        aspect-ratio: 16 / 9;
        min-height: 0;
        position: sticky;
        top: 0;
        z-index: 40;
      }
      .article-reader { flex: none; overflow: visible; }
      .transcript-side { width: 100%; flex: 1 1 auto; border-left: none; border-top: 1px solid #333; }
      .nav-counter { display: none; }

      .nav-bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
        background: rgba(20, 20, 20, 0.92);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid #333;
      }
      .nav-fab { max-width: none; flex: 1; }
      body { padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px)); }
    }
    #cmdk { border: 1px solid #333; border-radius: 10px; padding: 0; width: min(520px, calc(100vw - 32px)); background: #1a1a1a; color: #eee; margin: 12vh auto auto; }
    #cmdk::backdrop { background: rgba(0,0,0,0.5); }
    #cmdkInput { width: 100%; box-sizing: border-box; padding: 14px 16px; font-size: 15px; background: transparent; color: inherit; border: none; border-bottom: 1px solid #333; outline: none; }
    #cmdkList { list-style: none; margin: 0; padding: 6px; max-height: 50vh; overflow-y: auto; }

    #cmdkList li.active { background: #333; }
    #cmdkList kbd { font-family: 'SF Mono', Monaco, monospace; font-size: 12px; color: #999; }
    [data-theme="light"] #cmdk { background: #fff; color: #111; border-color: #ddd; }
    [data-theme="light"] #cmdkInput { border-bottom-color: #ddd; }
    [data-theme="light"] #cmdkList li.active { background: #eee; }

    .overflow { position: relative; }
    .overflow-panel {
      display: none;
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      z-index: 70;
      min-width: 220px;
      padding: 6px;
      background: #1b1b1b;
      border: 1px solid #333;
      border-radius: 14px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    }
    .overflow.open .overflow-panel { display: block; }
    .overflow-panel .btn {
      display: block;
      width: 100%;
      margin: 2px 0;
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      background: transparent;
      text-align: left;
    }
    .overflow-panel .btn:hover { background: #27272a; }

    .shortcuts-dialog {
      border: 1px solid #333;
      border-radius: 20px;
      padding: 0;
      width: min(620px, calc(100vw - 32px));
      background: #1b1b1b;
      color: #fff;
      margin: 12vh auto auto;
    }
    .shortcuts-dialog::backdrop { background: rgba(0, 0, 0, 0.6); }

      padding: 3px 7px;

      border-radius: 6px;
      background: #27272a;
      color: #fff;
      font-family: 'SF Mono', 'Monaco', monospace;
      font-size: 12px;
      text-align: center;
    }
    .shortcuts-close {
      display: block;
      margin: 0 24px 18px auto;
      border: none;
      background: transparent;
      color: #6ea8ff;
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
    }

    @media (min-width: 769px) {
      html, body { background: #030303; font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif; }
      .header {
        position: sticky;
        top: 0;
        z-index: 50;
        background: #0b0b0b;
        border-bottom: 1px solid #27272a;
        padding: 10px 20px;
        gap: 14px;
        justify-content: flex-start;
      }
      .header-btns { margin-left: auto; }
      .logo { font-size: 17px; }
      .back-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 38px;
        height: 38px;
        padding: 0;
        border: 1px solid #333;
        border-radius: 999px;
        background: transparent;
        color: #fff;
        font-size: 18px;
        text-decoration: none;
        flex: none;
      }
      .back-btn:hover { background: #1b1b1b; }
      .header-btns { display: flex; flex-wrap: nowrap; align-items: center; gap: 8px; }
      .header-btns .btn {
        background: transparent;
        border: 1px solid #333;
        border-radius: 999px;
        padding: 7px 14px;
        font-size: 13px;
      }
      .header-btns .btn:hover { background: #1b1b1b; }
      .header-btns .btn-chat { background: #0057ff; border-color: #0057ff; color: #fff; }
      .header-btns .btn-chat:hover { background: #0066ff; }
      .header-btns .nav-prev,
      .header-btns .nav-next { min-width: 38px; padding: 7px 10px; }
      .header-btns .overflow > .btn { width: 38px; padding: 7px 0; font-size: 18px; }
      .overflow-panel .btn { border: none; border-radius: 8px; }
      .overflow-panel .btn-danger { background: transparent; color: #ef4444; }
      .menu-toggle { display: none; }
      .container { flex-direction: row; height: calc(100vh - 61px); min-height: 0; }
      .video-side { flex: 1; min-width: 0; }
      .video-wrapper { margin: 14px 20px 0; border-radius: 16px; overflow: hidden; }
      .video-info { padding: 16px 20px; }
      .video-title { font-size: 22px; }
      .mobile-tabs {
        display: flex;
        gap: 0;
        padding: 0;
        background: transparent;
        border-bottom: 1px solid #27272a;
        position: static;
      }
      .mobile-tab {
        flex: 1;
        padding: 14px 12px;
        background: none;
        border: none;
        border-bottom: 2px solid transparent;
        color: #888;
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
      }
      .mobile-tab.active { color: #fff; border-bottom-color: #0057ff; }
      .mobile-summary {
        display: block;
        flex: 1;
        overflow-y: auto;
        padding: 16px 18px 32px;
        font-size: 14px;
        line-height: 1.6;
        color: #ddd;
      }
      .mobile-summary h1,
      .mobile-summary h2,
      .mobile-summary h3 { font-size: 15px; margin: 14px 0 6px; color: #fff; }
      .mobile-summary p { margin-bottom: 8px; }
      .mobile-summary ul,
      .mobile-summary ol { margin: 8px 0; padding-left: 20px; }
      .mobile-summary li { margin-bottom: 4px; }
      .mobile-summary strong { color: #fff; }
      .mobile-summary a { color: #6ea8ff; text-decoration: none; }
      .transcript-side {
        width: 380px;
        min-width: 320px;
        background: #121212;
        border-left: 1px solid #27272a;
      }
      .transcript-header { display: none; }
      .transcript-side[data-tab="summary"] .transcript-content { display: none; }
      .transcript-side[data-tab="transcript"] .mobile-summary { display: none; }
      .transcript-side[data-tab="transcript"] .transcript-content { display: block; }
      .nav-bar { display: none; }
      body { padding-bottom: 0; }
      #cmdk { background: #1b1b1b; border-color: #333; }
    }
  </style>
</head>
<body>
  <header class="header" id="pageHeader">
    <a href="/" class="btn back-btn" aria-label="Back" title="Back">←</a>
    <a href="/" class="logo">
      <svg viewBox="0 0 24 24"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg>
      ChromeScribe
    </a>
    <div class="header-btns">
      <button class="btn nav-btn nav-prev desktop-only" onclick="goPrev()" title="Previous (k)" disabled>‹</button>
      <button class="btn nav-btn nav-next desktop-only" onclick="goNext()" title="Next (j)" disabled>›</button>
      <button class="btn btn-chat" onclick="chatOnClaude(this)" title="Copy transcript and open claude.ai">Chat on Claude</button>
      <button class="btn" onclick="copyText(this)">Copy</button>
      <div class="overflow" id="moreMenu">
        <button class="btn" id="moreToggle" onclick="toggleMorePanel(event)" aria-label="More actions" title="More">⋮</button>
        <div class="overflow-panel" id="morePanel">
          <a href="/subscriptions.html" class="btn">Subscriptions</a>
          <a href="/queue.html" class="btn">Queue</a>
          <a href="/reports.html" class="btn">Reports</a>
          <a href="/settings.html" class="btn">Settings</a>
          <button class="btn" id="themeToggle" onclick="csTheme.cycle()" title="Theme" aria-label="Theme">◐ Theme</button>
          <button class="btn" onclick="openOriginal()">Open original</button>
          <button class="btn" onclick="downloadMd()">Download MD</button>
          <button class="btn" id="readAloudBtn" onclick="readAloud()">Read aloud</button>
          <button class="btn btn-summarize" onclick="summarize()">Summarize</button>
          <button class="btn btn-retranscribe" onclick="retranscribe()">Retranscribe</button>
          <button class="btn btn-danger" onclick="deleteTranscript()">Delete</button>
          <button class="btn" onclick="openShortcuts()">Keyboard shortcuts</button>
        </div>
      </div>
    </div>
    <button class="btn menu-toggle" id="menuToggle" onclick="toggleHeaderMenu(event)" aria-label="More" title="More">⋯</button>
    <div id="readAloudPlayer"></div>
  </header>

  <div class="container">
    <div class="video-side">
      <div class="video-wrapper" id="videoWrapper" onclick="loadVideo()">
        <img id="videoThumb" class="video-thumbnail" alt="Video thumbnail" style="display:none;">
        <div id="videoPlaceholder" class="video-placeholder" style="display:none;">
          <div class="platform" id="placeholderPlatform"></div>
          <div class="title" id="placeholderTitle"></div>
          <div class="play-btn">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </div>
        </div>
        <div class="play-btn" id="thumbPlayBtn">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>
        <iframe id="video" src="" allowfullscreen></iframe>
      </div>
      <div class="article-reader" id="articleReader"></div>
      <div class="video-info">
        <h1 class="video-title" id="title"></h1>
        <p class="video-meta" id="meta"></p>
        <div class="video-tags" id="videoTags"></div>
      </div>
    </div>
    
    <div class="transcript-side" id="transcriptSide" data-tab="summary">
      <div class="mobile-tabs" id="mobileTabs">
        <button class="mobile-tab active" data-tab="summary" onclick="setTab('summary')">Summary</button>
        <button class="mobile-tab" data-tab="transcript" onclick="setTab('transcript')">Transcript</button>
      </div>
      <div class="transcript-header">Transcript</div>
      <div class="mobile-summary" id="mobileSummary"></div>
      <div class="transcript-content" id="content">
        <div class="loading">Loading...</div>
      </div>
    </div>
  </div>

  <nav class="nav-bar" id="navBar" aria-label="Transcript navigation">
    <button class="nav-fab nav-prev" onclick="goPrev()" title="Previous" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
      <span>Prev</span>
    </button>
    <div class="nav-counter" id="navCounter"></div>
    <button class="nav-fab nav-chat" onclick="chatOnClaude(this)" title="Copy transcript and open claude.ai">Chat on Claude</button>
    <button class="nav-fab nav-next" onclick="goNext()" title="Next" disabled>
      <span>Next</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.59 16.59 10 18l6-6-6-6-1.41 1.41L13.17 12z"/></svg>
    </button>
  </nav>
  
  <dialog id="shortcuts" class="shortcuts-dialog">
    <div class="shortcuts-head"><h2>Keyboard shortcuts</h2></div>
    <div class="shortcuts-cols">
      <div class="shortcut-row"><kbd>j</kbd> Next video</div>
      <div class="shortcut-row"><kbd>k</kbd> Previous video</div>
      <div class="shortcut-row"><kbd>Esc</kbd> Back to list</div>
      <div class="shortcut-row"><kbd>Space</kbd> Play or pause</div>
      <div class="shortcut-row"><kbd>←</kbd><kbd>→</kbd> Skip 10s</div>
      <div class="shortcut-row"><kbd>t</kbd> Summary or transcript</div>
      <div class="shortcut-row"><kbd>c</kbd> Chat on Claude</div>
      <div class="shortcut-row"><kbd>y</kbd> Copy</div>
      <div class="shortcut-row"><kbd>r</kbd> Read aloud</div>
      <div class="shortcut-row"><kbd>d</kbd> Download MD</div>
      <div class="shortcut-row"><kbd>#</kbd> Delete</div>
      <div class="shortcut-row"><kbd>?</kbd> This list</div>
    </div>
    <button class="shortcuts-close" onclick="document.getElementById('shortcuts').close()">Close</button>
  </dialog>

  <dialog id="cmdk">
    <input id="cmdkInput" placeholder="Type a command…" autocomplete="off">
    <ul id="cmdkList"></ul>
  </dialog>
  <script>
    const API = '/api';
    let markdown = '';
    let navList = null;
    let navIndex = -1;
    let readAloudAudio = null;
    window.addEventListener('pagehide', stopReadAloud);
    document.addEventListener('click', e => {
      if (!e.target.closest('#pageHeader')) closeHeaderMenu();
    });

    window.csThemeRender = function () {
      const btn = document.getElementById('themeToggle');
      if (!btn) return;
      btn.textContent = csTheme.icon() + ' Theme';
      btn.title = csTheme.label();
      btn.setAttribute('aria-label', csTheme.label());
    };
    csThemeRender();
    function toggleTheme() {
      csTheme.cycle();
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function toggleHeaderMenu(event) {
      if (event) event.stopPropagation();
      document.getElementById('pageHeader').classList.toggle('menu-open');
    }

    function closeHeaderMenu() {
      document.getElementById('pageHeader').classList.remove('menu-open');
      document.getElementById('moreMenu').classList.remove('open');
    }

    function toggleMorePanel(event) {
      if (event) event.stopPropagation();
      document.getElementById('moreMenu').classList.toggle('open');
    }

    function openShortcuts() {
      const dialog = document.getElementById('shortcuts');
      if (dialog && typeof dialog.showModal === 'function') dialog.showModal();
    }

    function setTab(name) {
      document.getElementById('transcriptSide').setAttribute('data-tab', name);
      document.querySelectorAll('.mobile-tab').forEach(tab => {
        tab.classList.toggle('active', tab.getAttribute('data-tab') === name);
      });
    }

    function summarySection(text) {
      const start = text.search(/^##\s+TL;DR\s*$/m);
      if (start < 0) return '';
      const rest = text.slice(start);
      const end = rest.search(/^---\s*$/m);
      return (end < 0 ? rest : rest.slice(0, end)).replace(/\n+##\s+Full[\s\S]*$/, '').trim();
    }

    function renderMobileSummary(text) {
      const box = document.getElementById('mobileSummary');
      const summary = summarySection(text);
      box.innerHTML = summary ? parseMarkdown(summary) : '<p class="empty-summary">No summary yet.</p>';
    }

    function setMetaLine(meta) {
      const read = Math.max(1, Math.round((meta.word_count || 0) / 200)) + ' min read';
      const el = document.getElementById('meta');
      if (!meta.channel) { el.textContent = read; return; }
      el.innerHTML = '<a class="channel-link" href="/?channel=' + encodeURIComponent(meta.channel) + '">' + escapeHtml(meta.channel) + '</a> • ' + read;
    }
    
    async function init() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      
      if (!id) {
        showError('No transcript ID provided');
        return;
      }
      
      try {
        const metaRes = await fetch(API + '/transcripts/' + id);
        if (!metaRes.ok) throw new Error('Not found');
        const meta = (await metaRes.json()).data;
        
        const contentRes = await fetch(API + '/transcript/' + id + '/content');
        if (!contentRes.ok) throw new Error('Content not found');
        markdown = await contentRes.text();
        renderMobileSummary(markdown);
        
        const isArticle = meta.video_id.startsWith('article:');

        let videoSrc = null;
        let thumbUrl = meta.thumbnail_url || null;

        if (isArticle) {
          const summaryMd = markdown.replace(/\n##\s+Full Article[\s\S]*$/i, '').trim();
          const sourceMatch = markdown.match(/\*\*Source:\*\*\s*(https?:\/\/[^\s]+)/);
          const sourceUrl = sourceMatch ? sourceMatch[1] : '';

          document.getElementById('videoWrapper').style.display = 'none';
          const reader = document.getElementById('articleReader');
          reader.style.display = 'flex';
          reader.appendChild(document.getElementById('content'));
          reader.before(document.querySelector('.video-info'));
          document.querySelector('.transcript-side').style.display = 'none';

          const titleMatch2 = markdown.match(/^#\s+(.+)$/m);
          const displayTitle2 = titleMatch2 ? titleMatch2[1] : meta.title;
          document.getElementById('title').textContent = displayTitle2;
          setMetaLine(meta);

          document.getElementById('videoTags').innerHTML = meta.category ? '<span class="category-pill">' + escapeHtml(meta.category) + '</span>' : '';
          if (sourceUrl) {
            const open = document.createElement('a');
            open.className = 'open-original';
            open.href = sourceUrl;
            open.target = '_blank';
            open.rel = 'noopener';
            open.textContent = 'Read original →';
            document.querySelector('.video-info').appendChild(open);
          }

          document.getElementById('content').innerHTML = parseMarkdown(summaryMd);
          applySummarizeState();
          return;
        }

        if (/^[a-zA-Z0-9_-]{11}$/.test(meta.video_id)) {
          videoSrc = 'https://www.youtube.com/embed/' + meta.video_id + '?autoplay=1&enablejsapi=1';
          thumbUrl = 'https://img.youtube.com/vi/' + meta.video_id + '/maxresdefault.jpg';
        } else if (meta.video_id.startsWith('tiktok:')) {
          const tiktokId = meta.video_id.replace('tiktok:', '');
          videoSrc = 'https://www.tiktok.com/player/v1/' + tiktokId + '?autoplay=1';
        } else if (meta.video_id.startsWith('x:')) {
          videoSrc = 'https://platform.twitter.com/embed/Tweet.html?dnt=true&theme=dark&id=' + meta.video_id.replace('x:', '');
        } else {
          const ytMatch = markdown.match(/youtube\.com\/watch\?v=([a-zA-Z0-9_-]{11})/);
          const ttMatch = meta.video_id.match(/([0-9]{19,20})/);
          if (ytMatch) {
            videoSrc = 'https://www.youtube.com/embed/' + ytMatch[1] + '?autoplay=1&enablejsapi=1';
            thumbUrl = 'https://img.youtube.com/vi/' + ytMatch[1] + '/maxresdefault.jpg';
          } else if (ttMatch) {
            videoSrc = 'https://www.tiktok.com/player/v1/' + ttMatch[1] + '?autoplay=1';
          }
        }
        
        window.videoSrc = videoSrc;
        
        let displayTitle = meta.title;
        const titleMatch = markdown.match(/^#\s+(.+)$/m);
        if (titleMatch && !meta.title.includes(' ')) {
          displayTitle = titleMatch[1];
        }
        
        const sourceMatch = markdown.match(/\*\*Source:\*\*\s*(https?:\/\/[^\s]+)/);
        const sourceUrl = sourceMatch ? sourceMatch[1] : '';

        const isTikTok = meta.video_id.startsWith('tiktok:') || sourceUrl.includes('tiktok.com');
        const isYouTube = /^[a-zA-Z0-9_-]{11}$/.test(meta.video_id) || sourceUrl.includes('youtube.com');
        const isX = meta.video_id.startsWith('x:');
        const platform = isX ? 'X' : isTikTok ? 'TikTok' : isYouTube ? 'YouTube' : 'Video';
        
        if (thumbUrl) {
          const thumb = document.getElementById('videoThumb');
          thumb.src = thumbUrl;
          thumb.style.display = 'block';
          thumb.onerror = function() {
            showPlaceholder(platform, displayTitle);
          };
        } else if (videoSrc) {
          showPlaceholder(platform, displayTitle);
        } else {
          document.getElementById('videoWrapper').onclick = null;
          document.getElementById('videoThumb').style.display = 'none';
          document.getElementById('thumbPlayBtn').style.display = 'none';
          document.getElementById('videoPlaceholder').style.display = 'none';
        }
        
        document.getElementById('title').textContent = displayTitle;
        setMetaLine(meta);

        document.getElementById('videoTags').innerHTML = meta.category ? '<span class="category-pill">' + escapeHtml(meta.category) + '</span>' : '';

        document.getElementById('content').innerHTML = parseMarkdown(markdown);
        applySummarizeState();

      } catch (e) {
        showError(e.message);
      }

      loadNav(id);
    }

    async function loadNav(currentId) {
      try {
        const res = await fetch(API + '/transcripts');
        if (!res.ok) return;
        const json = await res.json();
        navList = (json.data || []).map(t => String(t.id));
        navIndex = navList.indexOf(String(currentId));
        updateNavButtons();
      } catch {}
    }

    function updateNavButtons() {
      const prevs = document.querySelectorAll('.nav-prev');
      const nexts = document.querySelectorAll('.nav-next');
      const counter = document.getElementById('navCounter');
      const noList = !navList || navIndex < 0;
      const prevDisabled = noList || navIndex <= 0;
      const nextDisabled = noList || navIndex >= navList.length - 1;
      prevs.forEach(b => b.disabled = prevDisabled);
      nexts.forEach(b => b.disabled = nextDisabled);
      if (counter) {
        counter.textContent = noList ? '' : (navIndex + 1) + ' / ' + navList.length;
      }
    }

    function goPrev() {
      if (!navList || navIndex <= 0) return;
      window.location.search = '?id=' + navList[navIndex - 1];
    }

    function goNext() {
      if (!navList || navIndex < 0 || navIndex >= navList.length - 1) return;
      window.location.search = '?id=' + navList[navIndex + 1];
    }

    const COMMANDS = [
      { label: 'Previous', key: '← / K', run: goPrev, ok: () => !document.querySelector('.nav-prev')?.disabled },
      { label: 'Next', key: '→ / J', run: goNext, ok: () => !document.querySelector('.nav-next')?.disabled },
      { label: 'Play / pause video', key: 'Space', run: togglePlay, ok: () => !!window.videoSrc },
      { label: 'Delete', key: '# / Del', run: deleteTranscript },
      { label: 'Home', key: 'Esc', run: () => { window.location.href = '/'; } },
      { label: 'Open original', key: 'O', run: openOriginal },
      { label: 'Chat on Claude', key: 'C', run: () => chatOnClaude(document.querySelector('.btn-chat')) },
      { label: 'Copy markdown', key: 'Y', run: () => copyText([...document.querySelectorAll('.btn')].find(b => b.textContent.trim() === 'Copy')) },
      { label: 'Reading tab', key: 'T', run: () => setTab(document.getElementById('transcriptSide').getAttribute('data-tab') === 'summary' ? 'transcript' : 'summary') },
      { label: 'Download MD', key: 'D', run: downloadMd },
      { label: 'Read aloud', key: 'R', run: readAloud },
      { label: 'Re-summarize', run: summarize },
      { label: 'Retranscribe', run: retranscribe },
      { label: 'Toggle theme', run: toggleTheme },
      { label: 'Keyboard shortcuts', key: '?', run: () => openCmdk(true) },
      { label: 'Command menu', key: 'Ctrl+K', run: () => openCmdk() },
      { label: 'Settings', key: '$', run: () => { window.location.href = '/settings.html'; } },
    ];

    function openOriginal() {
      const m = markdown.match(/\*\*Source:\*\*\s*(https?:\/\/[^\s]+)/);
      if (m) window.open(m[1], '_blank', 'noopener');
    }

    let videoPlaying = false;
    let videoTime = 0;
    let pendingSeek = 0;
    function seekBy(seconds) {
      const wrapper = document.getElementById('videoWrapper');
      if (!wrapper.classList.contains('playing')) return;
      const target = Math.max(0, videoTime + seconds);
      videoTime = target;
      if (isTikTok()) tiktokCommand('seekTo', target);
      else document.getElementById('video').contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'seekTo', args: [target, true] }), '*');
    }
    function tiktokCommand(type, value) {
      const msg = { 'x-tiktok-player': true, type };
      if (value !== undefined) msg.value = value;
      document.getElementById('video').contentWindow.postMessage(msg, 'https://www.tiktok.com');
    }
    window.addEventListener('message', (e) => {
      let host = '';
      try { host = new URL(e.origin).hostname; } catch { return; }
      if (/youtube\.com$/.test(host)) {
        try {
          const d = JSON.parse(e.data);
          if (d.info && typeof d.info.currentTime === 'number') videoTime = d.info.currentTime;
          if (d.info && d.info.playerState !== undefined) videoPlaying = d.info.playerState === 1;
        } catch {}
      } else if (host === 'www.tiktok.com') {
        let d = e.data;
        if (typeof d === 'string') { try { d = JSON.parse(d); } catch { return; } }
        if (!d || !d['x-tiktok-player']) return;
        if (d.type === 'onPlayerReady') {
          tiktokCommand('unMute');
          if (pendingSeek) { tiktokCommand('seekTo', pendingSeek); pendingSeek = 0; }
        }
        if (d.type === 'onStateChange') videoPlaying = d.value === 1;
      }
    });
    function togglePlay() {
      const wrapper = document.getElementById('videoWrapper');
      if (!wrapper.classList.contains('playing')) {
        loadVideo();
        videoPlaying = true;
        return;
      }
      if (isTikTok()) {
        tiktokCommand(videoPlaying ? 'pause' : 'play');
      } else {
        const iframe = document.getElementById('video');
        iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: videoPlaying ? 'pauseVideo' : 'playVideo', args: [] }), '*');
      }
      videoPlaying = !videoPlaying;
    }

    const cmdk = document.getElementById('cmdk');
    const cmdkInput = document.getElementById('cmdkInput');
    const cmdkList = document.getElementById('cmdkList');
    let cmdkItems = [], cmdkActive = 0;
    let cmdkKeysOnly = false;
    function renderCmdk() {
      const q = cmdkInput.value.toLowerCase();
      cmdkItems = COMMANDS.filter(c => (!c.ok || c.ok()) && (!cmdkKeysOnly || c.key) && c.label.toLowerCase().includes(q));
      cmdkActive = Math.min(cmdkActive, Math.max(cmdkItems.length - 1, 0));
      cmdkList.innerHTML = cmdkItems.map((c, i) =>
        `<li data-i="${i}" class="${i === cmdkActive ? 'active' : ''}"><span>${c.label}</span><kbd>${c.key || ''}</kbd></li>`).join('');
    }
    function runCmdk(i) {
      const c = cmdkItems[i];
      cmdk.close();
      if (c) c.run();
    }
    function openCmdk(keysOnly = false) {
      if (cmdk.open) cmdk.close();
      cmdkKeysOnly = keysOnly;
      cmdkInput.placeholder = keysOnly ? 'Keyboard shortcuts' : 'Type a command…';
      cmdkInput.value = '';
      cmdkActive = 0;
      renderCmdk();
      cmdk.showModal();
      cmdkInput.focus();
    }
    cmdkInput.addEventListener('input', () => { cmdkActive = 0; renderCmdk(); });
    cmdkInput.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') { e.preventDefault(); cmdkActive = (cmdkActive + 1) % cmdkItems.length; renderCmdk(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); cmdkActive = (cmdkActive - 1 + cmdkItems.length) % cmdkItems.length; renderCmdk(); }
      else if (e.key === 'Enter') { e.preventDefault(); runCmdk(cmdkActive); }
    });
    cmdkList.addEventListener('click', (e) => { const li = e.target.closest('li'); if (li) runCmdk(+li.dataset.i); });
    cmdk.addEventListener('click', (e) => { if (e.target === cmdk) cmdk.close(); });

    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); cmdk.open ? cmdk.close() : openCmdk(); return; }
      if (cmdk.open || e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.target.matches('input, textarea, [contenteditable]')) return;
      const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
      if (k === 'ArrowLeft' || k === 'ArrowRight') {
        e.preventDefault();
        if (document.getElementById('videoWrapper').classList.contains('playing')) seekBy(k === 'ArrowRight' ? 10 : -10);
        else if (k === 'ArrowLeft') goPrev();
        else goNext();
      }
      else if (k === 'k') { e.preventDefault(); goPrev(); }
      else if (k === 'j') { e.preventDefault(); goNext(); }
      else if (k === ' ' && window.videoSrc) { e.preventDefault(); togglePlay(); }
      else if (k === '#' || k === 'Delete') { e.preventDefault(); deleteTranscript(); }
      else if (k === 'Escape') { window.location.href = '/'; }
      else if (k === 'o') { openOriginal(); }
      else if (k === 't') { setTab(document.getElementById('transcriptSide').getAttribute('data-tab') === 'summary' ? 'transcript' : 'summary'); }
      else if (k === 'c') { chatOnClaude(document.querySelector('.btn-chat')); }
      else if (k === 'y') { copyText([...document.querySelectorAll('.btn')].find(b => b.textContent.trim() === 'Copy')); }
      else if (k === 'r') { readAloud(); }
      else if (k === 'd') { downloadMd(); }
      else if (k === '?') { e.preventDefault(); openShortcuts(); }
      else if (k === '$') { window.location.href = '/settings.html'; }
    });

    function parseMarkdown(text) {
      if (isYouTube() || isTikTok()) {
        text = text.replace(/\[(?:(\d+):)?(\d{1,2}):([0-5]\d)\]/g, (marker, hours, minutes, seconds) => {
          const t = Number(hours || 0) * 3600 + Number(minutes) * 60 + Number(seconds);
          return '<a class="ts" data-t="' + t + '" href="#t=' + t + '">' + marker + '</a>';
        });
      }
      const urlRegex = /(https?:\/\/[^\s<>"'{}|\\^`\[\]]+)/g;
      text = text.replace(urlRegex, '<a href="$1" target="_blank">$1</a>');
      
      return text
        .replace(/^# .+$/gm, '')
        .replace(/^## (.+)$/gm, '<h2>$1</h2>')
        .replace(/^### (.+)$/gm, '<h3>$1</h3>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        .replace(/`(.+?)`/g, '<code>$1</code>')
        .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
        .replace(/^---$/gm, '<hr>')
        .replace(/^- (.+)$/gm, '<li>$1</li>')
        .replace(/(?:<li>.+<\/li>\n)*<li>.+<\/li>/g, '<ul>$&</ul>')
        .replace(/^\d+\. (.+)$/gm, '<oli>$1</oli>')
        .replace(/(?:<oli>.+<\/oli>\n)*<oli>.+<\/oli>/g, '<ol>$&</ol>')
        .replace(/<oli>/g, '<li>')
        .replace(/<\/oli>/g, '</li>')
        .replace(/\n\n/g, '</p><p>')
        .replace(/^(?!<[houpbld])(.+)$/gm, '<p>$1</p>')
        .replace(/<p><\/p>/g, '')
        .replace(/<\/li><\/p>/g, '</li>');
    }
    
    function isYouTube() {
      return (window.videoSrc || '').startsWith('https://www.youtube.com/embed/');
    }

    function isTikTok() {
      return (window.videoSrc || '').startsWith('https://www.tiktok.com/player/v1/');
    }

    document.getElementById('content').addEventListener('click', (event) => {
      const link = event.target.closest('a.ts');
      if (!link || !(isYouTube() || isTikTok())) return;
      event.preventDefault();
      const seconds = Number(link.dataset.t);
      if (!document.getElementById('videoWrapper').classList.contains('playing')) {
        loadVideo(seconds);
      } else if (isTikTok()) {
        tiktokCommand('seekTo', seconds);
        tiktokCommand('play');
      } else {
        const player = document.getElementById('video').contentWindow;
        player.postMessage(JSON.stringify({ event: 'command', func: 'seekTo', args: [seconds, true] }), 'https://www.youtube.com');
        player.postMessage(JSON.stringify({ event: 'command', func: 'playVideo', args: [] }), 'https://www.youtube.com');
      }
      videoPlaying = true;
    });

    function loadVideo(start = 0) {
      if (!window.videoSrc) return;
      const wrapper = document.getElementById('videoWrapper');
      const iframe = document.getElementById('video');
      const src = new URL(window.videoSrc);
      if (isYouTube()) src.searchParams.set('start', String(start));
      if (isTikTok()) pendingSeek = start;
      iframe.src = src.href;
      wrapper.classList.add('playing');
    }
    
    function showPlaceholder(platform, title) {
      document.getElementById('videoThumb').style.display = 'none';
      document.getElementById('thumbPlayBtn').style.display = 'none';
      document.getElementById('placeholderPlatform').textContent = platform;
      document.getElementById('placeholderTitle').textContent = title;
      document.getElementById('videoPlaceholder').style.display = 'flex';
    }
    
    function showError(msg) {
      document.getElementById('content').innerHTML = '<div class="error"><p>' + msg + '</p><a href="/">Back to Dashboard</a></div>';
    }
    
    function flashBtn(btn, msg, ms = 1500) {
      if (!btn) return;
      const original = btn.innerHTML;
      btn.innerHTML = msg;
      btn.disabled = true;
      setTimeout(() => {
        btn.innerHTML = original;
        btn.disabled = false;
      }, ms);
    }

    function stopReadAloud() {
      if (readAloudAudio) readAloudAudio.pause();
      document.getElementById('readAloudBtn').textContent = 'Read aloud';
    }

    async function readAloud() {
      if (readAloudAudio && !readAloudAudio.paused) {
        stopReadAloud();
        return;
      }
      const btn = document.getElementById('readAloudBtn');
      if (!readAloudAudio) {
        const id = new URLSearchParams(window.location.search).get('id');
        readAloudAudio = document.createElement('audio');
        readAloudAudio.preload = 'none';
        readAloudAudio.src = `${API}/speak/${id}`;
        readAloudAudio.controls = true;
        readAloudAudio.style.cssText = 'display:block;width:100%;margin-top:12px;';
        readAloudAudio.addEventListener('playing', () => { btn.textContent = 'Stop'; });
        readAloudAudio.addEventListener('pause', () => { btn.textContent = 'Read aloud'; });
        readAloudAudio.addEventListener('ended', stopReadAloud);
        readAloudAudio.addEventListener('error', () => {
          stopReadAloud();
          btn.title = 'Could not load read-aloud audio';
        });
        document.getElementById('readAloudPlayer').appendChild(readAloudAudio);
      }
      btn.title = '';
      btn.textContent = 'Loading…';
      try {
        if (readAloudAudio.error) readAloudAudio.load();
        await readAloudAudio.play();
      } catch (e) {
        stopReadAloud();
        if (e.name !== 'AbortError') btn.title = 'Could not play read-aloud audio';
      }
    }

    async function copyText(btn) {
      try {
        await navigator.clipboard.writeText(markdown);
        flashBtn(btn, '✅ Copied');
      } catch {
        flashBtn(btn, '❌ Failed');
      }
    }

    async function chatOnClaude(btn) {
      const titleMatch = markdown.match(/^#\s+(.+)$/m);
      const title = titleMatch ? titleMatch[1].trim() : (document.getElementById('title').textContent || 'this transcript');
      const prompt = `I'd like to chat about the following transcript: "${title}".\n\nPlease read it, then I'll ask questions.\n\n---\n\n${markdown}`;
      try {
        await navigator.clipboard.writeText(prompt);
        flashBtn(btn, '✅ Copied , opening Claude');
        window.open('https://claude.ai/new', '_blank', 'noopener');
      } catch {
        flashBtn(btn, '❌ Copy failed');
      }
    }
    
    function downloadMd() {
      const blob = new Blob([markdown], { type: 'text/markdown' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'transcript.md';
      a.click();
    }
    
    async function deleteTranscript() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (!id) return;
      const title = document.querySelector('.title')?.textContent || 'this transcript';
      if (!confirm(`Delete "${title}"?`)) return;
      try {
        const res = await fetch(`/api/transcripts/${id}`, { method: 'DELETE', credentials: 'same-origin' });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || `HTTP ${res.status}`);
        }
        const nextId = navList && navIndex >= 0 ? (navList[navIndex + 1] ?? navList[navIndex - 1]) : null;
        window.location.href = nextId ? '/transcript.html?id=' + nextId : '/';
      } catch (err) {
        alert('Failed to delete: ' + err.message);
      }
    }

    async function retranscribe() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (!id) return;
      
      const btn = document.querySelector('.btn-retranscribe');
      btn.disabled = true;
      btn.textContent = '⏳ Retranscribing...';
      
      try {
        const sourceMatch = markdown.match(/\*\*Source:\*\*\s*(https?:\/\/[^\s]+)/);
        const sourceUrl = sourceMatch ? sourceMatch[1] : null;
        
        if (!sourceUrl) {
          alert('Could not find original URL to retranscribe');
          btn.disabled = false;
          btn.textContent = '♻️ Retranscribe';
          return;
        }
        
        const projectDir = 'C:/Users/valen/Documents/GitHub/chromescribe';
        const cmd = `bash process.sh "${sourceUrl}"`;
        const terminalUrl = `http://localhost:7681/?cwd=${encodeURIComponent(projectDir)}&cmd=${encodeURIComponent(cmd)}&title=Retranscribe`;
        
        window.open(terminalUrl, '_blank');
        
        btn.textContent = '✅ Processing opened';
        setTimeout(() => {
          btn.disabled = false;
          btn.textContent = '♻️ Retranscribe';
        }, 3000);
        
      } catch (e) {
        alert('Error: ' + e.message);
        btn.disabled = false;
        btn.textContent = '♻️ Retranscribe';
      }
    }

    function applySummarizeState() {
      const isRaw = !/^##\s+TL;DR/m.test(markdown);
      const btn = document.querySelector('.btn-summarize');
      if (btn) btn.textContent = isRaw ? '✨ Summarize' : '✨ Re-summarize';
      if (isRaw) {
        const content = document.getElementById('content');
        if (content && !content.querySelector('.summarize-banner')) {
          const banner = document.createElement('div');
          banner.className = 'summarize-banner';
          banner.textContent = 'Not summarized yet , only the raw transcript is shown. Click ✨ Summarize to generate the TL;DR and article.';
          content.prepend(banner);
        }
      }
    }

    async function summarize() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (!id) return;

      const btn = document.querySelector('.btn-summarize');
      const original = btn.textContent;
      btn.disabled = true;
      btn.textContent = '⏳ Summarizing…';

      try {
        const res = await fetch(`${API}/transcripts/${id}/analyze`, {
          method: 'POST',
          credentials: 'same-origin',
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || `HTTP ${res.status}`);
        }
        window.location.reload();
      } catch (e) {
        alert('Summarize failed: ' + e.message);
        btn.disabled = false;
        btn.textContent = original;
      }
    }

    init();
  </script>
